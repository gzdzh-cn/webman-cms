<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="renderer" content="webkit|ie-comp|ie-stand">
<meta http-equiv="X-UA-Compatible" content="IE=Edge">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no">
<title>搜索页_{eyou:global name="web_name" /}</title>
<meta name="description" content="" />
<meta name="keywords" content="" />
<link href="{eyou:global name='web_cmspath' /}/favicon.ico" rel="shortcut icon" type="image/x-icon" />
<meta http-equiv="Cache-Control" content="no-transform" />
<meta name="applicable-device" content="wap">
<meta name="MobileOptimized" content="width" />
<meta name="HandheldFriendly" content="true" />
<script type="text/javascript" src="{eyou:global name='web_templets_m' /}/skin/js/jquery-1.12.4.min.js"></script>
<link rel="stylesheet" href="{eyou:global name='web_templets_m' /}/skin/css/you.css">
<link rel="stylesheet" href="{eyou:global name='web_templets_m' /}/skin/css/font-awesome.min.css">
<script type="text/javascript" src="{eyou:global name='web_templets_m' /}/skin/js/you.js"></script>
<script type="text/javascript" src="{eyou:global name='web_templets_m' /}/skin/js/moment.min.js"></script>
<link rel="stylesheet" href="{eyou:global name='web_templets_m' /}/skin/css/animate.min.css">
</head>
<body>
{eyou:include file="header.htm" /}
<div class="main container">
  <div class="page_tit">
    <p><span>搜索<strong>{$eyou.field.keywords}</strong>的结果</span></p>
  </div>
  
  <div class="news_list" id="news_list">
    <ul>
      {eyou:list titlelen='30' pagesize='6'}
      <li>
        <div class="fl"><a href="{$field.arcurl}"><span>{$field.title}</span></a></div>
        <div class="fr">
          <p>{$field.add_time|MyDate='Y-m-d',###}</p>
        </div>
      </li>
      {/eyou:list}
    </ul>
  </div>
  <div class="page">
        <div class="pagination">
        {eyou:pagelist listitem='index,pre,next,end' listsize='2' /}
        </div>
      </div>
  <script type="text/javascript">
            $(function () {
                $('.imgauto1 img').imgAuto();
            })
        </script> 
</div>
{eyou:include file="footer.htm" /}
</body>
</html>
