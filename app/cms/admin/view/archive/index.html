    <script>

        // 相关常量
        const PRIMARY_KEY = "aid";
        const SELECT_API = "/web-admin/archive/select";
        const UPDATE_API = "/web-admin/archive/update";
        const DELETE_API = "/web-admin/archive/delete";
        const INSERT_URL = "/web-admin/archive/insert";
        const UPDATE_URL = "/web-admin/archive/update";
        const ARCTYPE_SELECT_API = "/web-admin/arctype/select";
        const WORKFLOW_PERMISSIONS = <?= json_encode([
            'review'=>\plugin\admin\api\Auth::canAccess(\plugin\admin\app\controller\ArchiveController::class,'updateStatus'),
            'update'=>\plugin\admin\api\Auth::canAccess(\plugin\admin\app\controller\ArchiveController::class,'update'),
            'copy'=>\plugin\admin\api\Auth::canAccess(\plugin\admin\app\controller\ArchiveController::class,'insert') && \plugin\admin\api\Auth::canAccess(\plugin\admin\app\controller\ArchiveController::class,'select'),
        ], JSON_HEX_TAG|JSON_HEX_AMP|JSON_HEX_APOS|JSON_HEX_QUOT) ?>;

         // 当前选中的栏目ID
         let currentTypeId = 0;
         // 当前选中栏目的模型ID
         let currentChannelId = 0;
         // 保存完整的树数据（包含模型信息）
         let treeData = [];
         // 栏目信息映射表（id -> {current_channel, ...}）
         let arctypeInfoMap = {};

        // 表格渲染
        layui.use(["table", "form", "pearCommon", "pearPopup", "util", "pearDtree"], function () {
            let table = layui.table;
            let form = layui.form;
            let $ = layui.$;
            let common = layui.pearCommon;
            let util = layui.util;
            let dtree = layui.pearDtree;

            // 表头参数
            let cols = [
                {
                    type: "checkbox",
                    align: "center",
                    width: 50
                }, {
                    title: "ID",
                    align: "center",
                    field: "aid",
                    width: 80
                }, {
                    title: "标题",
                    align: "left",
                    field: "title",
                    minWidth: 200
                }, {
                    title: "栏目",
                    align: "center",
                    field: "typename",
                    width: 150
                }, {
                    title: "审核状态",
                    align: "center",
                    field: "arcrank",
                    templet: function (d) {
                        const value = Number(d.arcrank);
                        const isAudited = value === 0;
                        const cls = isAudited ? "status-show" : "status-hide";
                        const icon = isAudited ? "layui-icon-ok-circle" : "layui-icon-close-fill";
                        const text = isAudited ? "已审核" : value === -1 ? "待审核" : value === -2 ? "已退回" : "受限浏览";
                        const hint = value === -2 ? ('退回原因：' + (d.reason || '未填写') + '。编辑后可重新提交。') : '点击切换审核状态';
                        return '<span class="status-badge ' + cls + '" role="button" tabindex="0" title="' + util.escape(hint) + '" data-id="' + util.escape(d.aid) + '" data-field="arcrank" data-value="' + value + '"><i class="layui-icon ' + icon + '"></i>' + text + '</span>';
                    },
                    width: 112
                }, {
                    title: "点击",
                    align: "center",
                    field: "click",
                    width: 80
                }, {
                    title: "发布时间",
                    align: "center",
                    field: "add_time",
                    templet: function (d) {
                        if (!d.add_time) return '';
                        const date = new Date(d.add_time * 1000);
                        return date.getFullYear() + '-' +
                            String(date.getMonth() + 1).padStart(2, '0') + '-' +
                            String(date.getDate()).padStart(2, '0') + ' ' +
                            String(date.getHours()).padStart(2, '0') + ':' +
                            String(date.getMinutes()).padStart(2, '0');
                    },
                    width: 160
                }, {
                    title: "操作",
                    toolbar: "#table-bar",
                    align: "center",
                    fixed: window.matchMedia("(max-width: 767px)").matches ? false : "right",
                    width: 286
                }, {
                    title: "排序",
                    align: "center",
                    field: "sort_order",
                    templet: function (d) {
                        return '<span class="sort-order-cell" data-id="' + d.aid + '" data-value="' + (d.sort_order || 0) + '" style="cursor:pointer;padding:5px;display:inline-block;min-width:40px;">' + (d.sort_order || 0) + '</span>';
                    },
                    width: 80
                }
            ];

            // 渲染表格
            table.render({
                elem: "#data-table",
                url: SELECT_API,
                page: true,
                cols: [cols],
                skin: "line",
                size: "lg",
                height: 'full',  // 表格高度占满容器
                toolbar: "#table-toolbar",
                autoSort: false,
                id: "data-table",
                defaultToolbar: [{
                    title: "刷新",
                    layEvent: "refresh",
                    icon: "layui-icon-refresh",
                }, "filter", "print", "exports"],
                where: {
                    exclude_channel: '6,8'  // 排除单页模型(6)和留言模型(8)
                },
                done: function () {
                    layer.photos({ photos: 'div[lay-id="data-table"]', anim: 5 });
                }
            });

            // 树展开/缩进状态
            let isTreeExpanded = false;

            // 初始化栏目树
            var DTree; // 声明在外部作用域，以便后续使用
            
            // 先获取树数据，避免重复请求
            $.ajax({
                url: ARCTYPE_SELECT_API + "?format=tree&limit=1000",
                type: 'get',
                dataType: 'json',
                success: function (result) {
                    if (result.code === 0 && result.data) {
                        treeData = result.data;
                        // 构建栏目信息映射表
                        function buildArctypeMap(nodes) {
                            if (!Array.isArray(nodes)) return;
                            nodes.forEach(function (node) {
                                if (node.id) {
                                    var id = String(node.id); // 统一使用字符串作为key
                                    arctypeInfoMap[id] = {
                                        id: node.id, lang: node.lang,
                                        current_channel: parseInt(node.current_channel) || 0,
                                        typename: node.typename || node.title || ''
                                    };
                                }
                                if (node.children && Array.isArray(node.children)) {
                                    buildArctypeMap(node.children);
                                }
                            });
                        }
                        buildArctypeMap(result.data);

                        // 使用已获取的数据初始化树组件
                        DTree = dtree.render({
                            elem: "#arctypeTree",
                            initLevel: "1",  // 设置为 1，默认不展开，只显示根节点
                            line: true,
                            ficon: ["1", "-1"],
                            icon: ["0", "2"],
                            data: result.data,  // 直接使用已获取的数据
                            dataStyle: "layuiStyle",
                            response: {
                                statusName: "code",
                                statusCode: 0,
                                message: "msg",
                                rootName: "data",
                                treeId: "id",
                                parentId: "parentId",
                                title: "title",
                                childName: "children"
                            }
                        });
                    }
                },
                error: function (xhr, status, error) {
                    console.error('加载栏目树数据失败:', error);
                    // 如果请求失败，仍然尝试使用 url 方式初始化树组件
                    DTree = dtree.render({
                        elem: "#arctypeTree",
                        initLevel: "1",
                        line: true,
                        ficon: ["1", "-1"],
                        icon: ["0", "2"],
                        method: 'get',
                        url: ARCTYPE_SELECT_API + "?format=tree&limit=1000",
                        dataStyle: "layuiStyle",
                        response: {
                            statusName: "code",
                            statusCode: 0,
                            message: "msg",
                            rootName: "data",
                            treeId: "id",
                            parentId: "parentId",
                            title: "title",
                            childName: "children"
                        }
                    });
                }
            });

            // 绑定展开/缩进按钮点击事件
            $("#treeExpandBtn").on("click", function () {
                if (isTreeExpanded) {
                    // 当前是展开状态，执行缩进
                    DTree.menubarMethod().closeAllNode();
                    $(this).html('<i class="layui-icon layui-icon-spread-left"></i> 展开全部');
                    isTreeExpanded = false;
                } else {
                    // 当前是缩进状态，执行展开
                    DTree.menubarMethod().openAllNode();
                    $(this).html('<i class="layui-icon layui-icon-shrink-right"></i> 缩进全部');
                    isTreeExpanded = true;
                }
            });

            // 左侧栏目显示/隐藏状态
            let isSidebarVisible = true;

            // 手机使用独立展开状态，不改桌面侧栏和树节点的状态。
            const mobileCategoryMedia = window.matchMedia('(max-width: 767px)');
            function setMobileCategoryOpen(open, restoreFocus) {
                const expanded = mobileCategoryMedia.matches && !!open;
                document.body.classList.toggle('cms-archive-category-open', expanded);
                const button = document.querySelector('#mobileCategoryToggle');
                button.setAttribute('aria-expanded', String(expanded));
                button.querySelector('[data-mobile-category-action]').textContent = expanded ? '收起栏目' : '选择栏目';
                if (!expanded && restoreFocus) button.focus();
            }
            $('#mobileCategoryToggle').on('click', function () {
                setMobileCategoryOpen(this.getAttribute('aria-expanded') !== 'true');
            });
            $('#mobileCategoryBackdrop').on('click', function () {setMobileCategoryOpen(false, true);});
            document.addEventListener('keydown', function (event) {
                if (event.key === 'Escape' && document.body.classList.contains('cms-archive-category-open')) {
                    event.preventDefault();
                    setMobileCategoryOpen(false, true);
                }
            });
            mobileCategoryMedia.addEventListener('change', function () {setMobileCategoryOpen(false);});
            setMobileCategoryOpen(false);

            // 绑定吸附按钮点击事件
            $("#sidebarToggleBtn").on("click", function () {
                if (isSidebarVisible) {
                    // 隐藏左侧栏目
                    $("#leftSidebar").addClass("hidden");
                    $("#rightContent").addClass("expanded");
                    $("#sidebarToggleBtn").addClass("hidden");
                    $("#sidebarToggleBtn i").removeClass("layui-icon-left").addClass("layui-icon-right");
                    isSidebarVisible = false;
                } else {
                    // 显示左侧栏目
                    $("#leftSidebar").removeClass("hidden");
                    $("#rightContent").removeClass("expanded");
                    $("#sidebarToggleBtn").removeClass("hidden");
                    $("#sidebarToggleBtn i").removeClass("layui-icon-right").addClass("layui-icon-left");
                    isSidebarVisible = true;
                }
            });


            /**
             * 递归获取指定节点及其所有子节点的ID
             * @param {Array} nodes 树节点数组
             * @param {string|number} nodeId 目标节点ID
             * @return {Array} 包含当前节点及其所有子节点ID的数组
             */
            function getAllChildrenIds(nodes, nodeId) {
                var result = [];

                // 递归函数，查找指定节点并收集其所有子节点ID
                function findNodeAndCollectChildren(nodes, targetId) {
                    for (var i = 0; i < nodes.length; i++) {
                        var node = nodes[i];
                        if (String(node.id) === String(targetId)) {
                            // 找到目标节点，添加当前节点ID
                            result.push(parseInt(node.id));
                            // 递归收集所有子节点ID
                            if (node.children && node.children.length > 0) {
                                collectChildrenIds(node.children);
                            }
                            return true;
                        } else if (node.children && node.children.length > 0) {
                            // 继续在子节点中查找
                            if (findNodeAndCollectChildren(node.children, targetId)) {
                                return true;
                            }
                        }
                    }
                    return false;
                }

                // 递归收集所有子节点ID
                function collectChildrenIds(children) {
                    for (var i = 0; i < children.length; i++) {
                        var child = children[i];
                        result.push(parseInt(child.id));
                        if (child.children && child.children.length > 0) {
                            collectChildrenIds(child.children);
                        }
                    }
                }

                findNodeAndCollectChildren(nodes, nodeId);
                return result;
            }

            // 从树数据中查找节点信息
            function findNodeInTree(nodes, nodeId) {
                if (!Array.isArray(nodes)) return null;
                for (var i = 0; i < nodes.length; i++) {
                    var node = nodes[i];
                    if (parseInt(node.id) === parseInt(nodeId)) {
                        return node;
                    }
                    if (node.children && Array.isArray(node.children)) {
                        var found = findNodeInTree(node.children, nodeId);
                        if (found) return found;
                    }
                }
                return null;
            }

            // 绑定栏目树节点点击事件
            dtree.on("node(arctypeTree)", function (obj) {
                // 获取点击事件对象
                var event = obj.event || window.event;
                if (!event) {
                    // 如果没有事件对象，默认执行完整逻辑
                    handleNodeClick(obj);
                    return;
                }
                
                var target = event.target || event.srcElement;
                var $target = $(target);
                var $node = $(obj.dom);
                
                // 检查点击的是否是图标区域
                // pearDtree 的图标通常在 .dtree-icon 或包含 i 标签的元素中
                var isIconClick = false;
                
                // 检查点击目标及其父元素是否是图标相关元素
                if ($target.is('i') || 
                    $target.hasClass('dtree-icon') || 
                    $target.hasClass('dtree-iconfont') ||
                    $target.closest('.dtree-icon, .dtree-iconfont, i').length > 0) {
                    isIconClick = true;
                }
                
                // 检查点击的是否是展开/折叠按钮区域（通常在节点左侧）
                var nodeOffset = $node.offset();
                var nodeWidth = $node.width();
                var clickX = event.pageX || event.clientX;
                
                // 如果点击位置在节点左侧30px内，认为是点击图标区域
                if (clickX && nodeOffset && (clickX - nodeOffset.left) < 30) {
                    isIconClick = true;
                }
                
                // 如果是非叶子节点且点击的是图标区域，只展开/折叠
                if (!obj.param.leaf && isIconClick) {
                    var $div = obj.dom;
                    DTree.clickSpread($div);
                    return; // 只展开/折叠，不执行后续逻辑
                }
                
                // 如果点击的是名称区域，只更新右侧内容，不展开/折叠
                handleNodeClick(obj);
            });
            
            // 处理节点点击（更新右侧内容）
            function handleNodeClick(obj) {
                // 更新当前选中的栏目ID和模型ID
                currentTypeId = parseInt(obj.param.nodeId) || 0;
                currentChannelId = 0;

                // 优先从树数据中查找节点信息
                if (currentTypeId > 0 && treeData && treeData.length > 0) {
                    var nodeInfo = findNodeInTree(treeData, currentTypeId);
                    if (nodeInfo && nodeInfo.current_channel) {
                        currentChannelId = parseInt(nodeInfo.current_channel) || 0;
                    }
                }

                // 如果树数据中没有，从映射表中获取
                if (currentChannelId === 0) {
                    var nodeIdStr = String(currentTypeId);
                    if (arctypeInfoMap[nodeIdStr]) {
                        currentChannelId = parseInt(arctypeInfoMap[nodeIdStr].current_channel) || 0;
                    }
                }

                // 如果还是没有，从后端获取栏目详情
                if (currentTypeId > 0 && currentChannelId === 0) {
                    $.ajax({
                        url: ARCTYPE_SELECT_API,
                        type: 'get',
                        dataType: 'json',
                        data: { id: currentTypeId },
                        async: false, // 同步请求，确保获取到模型ID后再判断
                        success: function (result) {
                            if (result.code === 0 && result.data && result.data.length > 0) {

            // 加载弹窗中的栏目下拉选项（使用和insert.html一样的树形数据格式）
            function loadDialogArctypeOptions() {
                $.ajax({
                    url: ARCTYPE_SELECT_API + "?format=tree&limit=2000",
                    type: 'get',
                    dataType: 'json',
                    success: function (result) {
                        if (result.code === 0 && result.data && Array.isArray(result.data)) {
                            var $select = $('#dialog-typeid-select');
                            $select.empty();
                            $select.append('<option value="">请选择栏目</option>');

                            // 扁平化树形数据（和insert.html一样的格式）
                            var options = flattenTree(result.data);

                            options.forEach(function (item) {
                                $select.append('<option value="' + item.id + '">' + item.label + '</option>');
                            });
                            form.render('select');
                        }
                    },
                    error: function (xhr, status, error) {
                        console.error('加载栏目数据请求失败:', error);
                    }
                });
            }

            // 扁平化树形数据（和insert.html一样的实现）
            function flattenTree(nodes, level) {
                level = level || 0;
                var list = [];
                if (!nodes || !Array.isArray(nodes)) {
                    return list;
                }
                nodes.forEach(function (node) {
                    if (!node) return;
                    var indent = level > 0 ? '├─'.repeat(level) : '';
                    var name = node.title || node.name || node.typename || '未命名';
                    list.push({
                        id: node.id,
                        label: indent + name
                    });
                    if (node.children && Array.isArray(node.children) && node.children.length > 0) {
                        list = list.concat(flattenTree(node.children, level + 1));
                    }
                });
                return list;
            }

            let workflowRunning = false;
            function workflowError(box,message) { box.text(message || '操作失败，请重试').show(); }
            async function workflowRequest(path,data,errorBox) {
                try {
                    const result=await $.ajax({
                        url:'/web-admin/archive/'+path, type:'POST', dataType:'json', data:data
                    });
                    if (!result || result.code) {workflowError(errorBox,result && result.msg);return null;}
                    return result;
                } catch (error) {workflowError(errorBox,'请求失败，请检查网络或登录状态后重试');return null;}
            }
            function workflowPanel(rows,description) {
                const body=$('<div>').addClass('cms-workflow-panel');
                body.append($('<p>').text('已选择 '+rows.length+' 篇文档。'+(description||'')));
                const error=$('<p>').addClass('cms-workflow-error').attr('role','alert').hide();
                body.append(error);return {body:body,error:error};

            function finishWorkflow(result,index) {

            function setWorkflowBusy(index,busy) {

            }
            function batchWorkflow() {
                const rows=table.checkStatus('data-table').data;
                if (!rows.length) return window.CmsUI.warning('请先选择文档');
                if (rows.length>100) return window.CmsUI.warning('每次最多操作100篇文档');
                const options=[];
                if (WORKFLOW_PERMISSIONS.review) options.push(['audit','审核通过'],['pending','设为待审核'],['return','退回文档'],['attributes','设置文档属性']);
                if (WORKFLOW_PERMISSIONS.update) options.push(['resubmit','重新提交已退回文档']);
                if (WORKFLOW_PERMISSIONS.copy) options.push(['copy','复制到栏目']);
                if (!options.length) return window.CmsUI.warning('没有可用的批量操作权限');
                const panel=workflowPanel(rows),select=$('<select>').addClass('layui-input').attr('aria-label','批量操作类型');
                options.forEach(item=>select.append($('<option>').val(item[0]).text(item[1])));panel.body.append(select);
                window.CmsUI.layer({type:1,title:'批量操作',area:['720px','300px'],content:panel.body,btn:['下一步','取消'],yes:function(index){
                    const action=select.val();layer.close(index);
                    if(action==='copy') return copyRows(rows);
                    if(action==='attributes') return attributeRows(rows);
                    if(action==='return') return returnDrafts(rows);
                    reviewRows(rows,action);
                }});
            }
            async function reviewRows(rows,operation) {
                if (workflowRunning) return;
                if (operation==='resubmit' && rows.some(row=>Number(row.arcrank)!==-2)) return window.CmsUI.warning('请只选择已退回的文档');
                const title={audit:'审核通过',pending:'设为待审核',resubmit:'重新提交审核'}[operation];
                if (!await window.CmsUI.confirm('确认将 '+rows.length+' 篇文档'+title+'？',{title:title,confirmText:'确认'})) return;
                workflowRunning=true;const loading=layer.load();
                const error=$('<p>');
                try {
                    const result=await workflowRequest(operation==='resubmit'?'resubmit':'batch',{aids:rows.map(row=>row.aid),operation:operation},error);
                    if (result) finishWorkflow(result);else window.CmsUI.failure(error.text());
                } finally {workflowRunning=false;layer.close(loading);}
            }
            function returnDrafts(rows) {
                if (!WORKFLOW_PERMISSIONS.review) return window.CmsUI.warning('无文档审核权限');
                const panel=workflowPanel(rows,'退回后需要编辑并重新提交审核。'),input=$('<textarea>').addClass('layui-textarea').attr({placeholder:'请填写退回原因（必填，最多2000字）',maxlength:2000,'aria-label':'退回原因'});
                panel.body.append($('<label>').text('退回原因'),input);
                window.CmsUI.layer({type:1,title:'退回文档',area:['720px','390px'],content:panel.body,btn:['确认退回','取消'],cancel:function(){return !workflowRunning;},btn2:function(){return !workflowRunning;},yes:async function(index){

                    setWorkflowBusy(index,true);panel.error.hide();
                    try {const result=await workflowRequest('rebackdraft',{aids:rows.map(row=>row.aid),reason:input.val()},panel.error);if(result)finishWorkflow(result,index);}finally{setWorkflowBusy(index,false);}
                }});

            function attributeRows(rows) {
                const panel=workflowPanel(rows,'未选择的属性保持原值。'),grid=$('<div>').addClass('cms-workflow-attributes');
                [['is_head','头条'],['is_special','特荐'],['is_top','置顶'],['is_recom','推荐'],['is_litpic','图片'],['is_roll','滚动'],['is_slide','幻灯'],['is_diyattr','自定义'],['is_b','标题加粗']].forEach(item=>{

                    grid.append($('<label>').append($('<span>').text(item[1]),select));

                }});

            function copyRows(rows) {
                const channel=Number(rows[0].channel),lang=rows[0].lang;

                const choices=Object.values(arctypeInfoMap).filter(row=>Number(row.current_channel)===channel&&row.lang===lang&&!Number(row.is_del));
                if(!choices.length)return window.CmsUI.warning('没有可复制到的同模型栏目');
                const panel=workflowPanel(rows,'每篇复制一份；先核验正文和关联，再确认创建。'),select=$('<select>').addClass('layui-input').attr('aria-label','复制目标栏目'),summary=$('<div>').addClass('cms-workflow-summary');
                choices.forEach(row=>select.append($('<option>').val(row.id).text(row.typename)));
                if(choices.some(row=>Number(row.id)===Number(rows[0].typeid)))select.val(rows[0].typeid);
                let token=null,dialogIndex;panel.body.append($('<label>').text('目标栏目'),select,summary);
                select.on('change',function(){token=null;summary.empty();panel.error.hide();$('#layui-layer'+dialogIndex+' .layui-layer-btn0').text('预检');});
                dialogIndex=window.CmsUI.layer({type:1,title:'复制文档',area:['720px','480px'],content:panel.body,btn:['预检','取消'],cancel:function(){return !workflowRunning;},btn2:function(){return !workflowRunning;},yes:async function(index){
                    if(workflowRunning)return;setWorkflowBusy(index,true);panel.error.hide();select.prop('disabled',true);
                    try {
                        if(!token){
                            const result=await workflowRequest('copyPlan',{aids:rows.map(row=>row.aid),typeid:select.val()},panel.error);
                            if(!result)return;
                            token=result.data.token;summary.empty().append($('<strong>').text('预检通过：将创建 '+result.data.count+' 篇副本至“'+result.data.target.name+'”。'),$('<p>').text(result.data.notice),$('<p>').text('请核对后再次点击底部按钮确认复制。'));
                            $('#layui-layer'+index+' .layui-layer-btn0').text('确认复制');
                            return;
                        }
                        const result=await workflowRequest('copy',{token:token},panel.error);if(result)finishWorkflow(result,index);
                    } finally {setWorkflowBusy(index,false);select.prop('disabled',false);}
                }});
            }

            // 执行删除
            let doRemove = function (ids) {
                let data = {};
                data[PRIMARY_KEY] = ids;
                data.recycle_enabled = <?= $cmsRecycleEnabled ? '"1"' : '"0"' ?>;
                window.CmsUI.confirm(<?= json_encode($cmsRecycleEnabled ? '确认将所选文档移入回收站？' : '回收站已关闭，确认彻底删除所选文档？此操作无法恢复。', JSON_HEX_TAG | JSON_HEX_AMP | JSON_HEX_APOS | JSON_HEX_QUOT | JSON_UNESCAPED_UNICODE) ?>, {title: "确认删除", confirmText: "确认删除"}).then(function(approved) {
                        if(!approved)return;
                    let loading = layer.load();
                    $.ajax({
                        url: DELETE_API,
                        data: data,
                        dataType: "json",
                        type: "post",
                        success: function (res) {
                            layer.close(loading);
                            if (res.code) {
                                return window.CmsUI.failure(res.msg);
                            }
                            return window.CmsUI.success("操作成功", refreshTable);
                        }
                    })
                });
            }

            // 刷新表格数据
            window.refreshTable = function () {
                // 显示列表容器，隐藏表单容器和单页容器
                $("#listModelContainer").show();
                $("#formContainer").hide();
                $("#singlePageContainer").hide();
                
                // 返回列表沿用已提交筛选，避免保留输入框却清空查询条件。
                var where = $.extend({}, table.getOptions("data-table").where, {
                    exclude_channel: '6,8'  // 排除单页模型(6)和留言模型(8)
                });
                delete where.typeid;
                if (currentTypeId > 0) {
                    // 如果树数据已加载，获取当前节点及其所有子节点的ID
                    if (treeData && treeData.length > 0) {
                        var allTypeIds = getAllChildrenIds(treeData, currentTypeId);
                        if (allTypeIds.length > 0) {
                            // 使用 whereIn 查询，传递数组格式
                            where.typeid = ['in', allTypeIds.join(',')];
                        }
                    } else {
                        // 树数据未加载完成，只查询当前节点
                        where.typeid = currentTypeId;
                    }
                }
                table.reload("data-table", {
                    where: where,
                    scrollPos: "fixed",
                    done: function (res, curr) {
                        if (curr > 1 && res.data && !res.data.length) {
                            curr = curr - 1;
                            table.reload("data-table", {
                                page: {
                                    curr: curr
                                },
                            })
                        }
                    }
                });
            }

            // 更新字段到数据库
            function updateField(id, field, value, callback) {
                let data = {};
                data[PRIMARY_KEY] = id;
                data[field] = value;
                $.ajax({
                    url: UPDATE_API,
                    type: "POST",
                    dataType: "json",
                    data: data,
                    success: function (res) {
                        if (res.code) {
                            window.CmsUI.failure(res.msg);
                            return;
                        }
                        if (callback) callback();
                    },
                    error: function () {
                        window.CmsUI.failure("请求失败");
                    }
                });
            }

            // 更新排序
            function updateSortOrder(id, sortOrder, successCallback, errorCallback) {
                updateField(id, 'sort_order', sortOrder, function () {
                    if (successCallback) successCallback();
                });
            }

            // 双击编辑排序
            $(document).on('dblclick', '.sort-order-cell', function (e) {
                e.stopPropagation();
                var $this = $(this);
                var id = $this.data('id');
                var oldValue = $this.data('value') || 0;
                var originalStyle = $this.attr('style') || '';
                var $input = $('<input type="number" class="layui-input" value="' + oldValue + '" style="width:80px;text-align:center;margin:0;border:1px solid #e6e6e6;height:28px;line-height:28px;padding:0 5px;">');
                $this.html($input);
                $input.focus().select();

                $input.on('blur', function () {
                    var newValue = parseInt($(this).val()) || 0;
                    updateSortOrder(id, newValue, function () {
                        $this.data('value', newValue);
                        $this.attr('style', originalStyle);
                        $this.text(newValue);
                        window.CmsUI.success('更新成功');
                    }, function () {
                        $this.attr('style', originalStyle);
                        $this.text(oldValue);
                    });
                });

                $input.on('keydown', function (e) {
                    e.stopPropagation();
                    if (e.keyCode === 13) {
                        $(this).blur();
                    } else if (e.keyCode === 27) {
                        $this.attr('style', originalStyle);
                        $this.text(oldValue);
                        $input.remove();
                    }
                });
            });

            // 点击切换审核状态
            $(document).on('click', '.status-badge', function () {
                var $this = $(this);
                if($this.data('busy'))return;
                var id = $this.data('id');
                var field = $this.data('field');
                // 修复：使用 Number() 或显式转换，避免 0 被当作 falsy 值
                var currentValue = Number($this.data('value'));
                // 如果转换失败，默认为 -1（待审核）
                if (isNaN(currentValue)) {
                    currentValue = -1;
                }
                if(currentValue===-2)return window.CmsUI.warning('文档已退回，请编辑后点击“重新提交”');
                $this.data('busy',true).attr('aria-disabled','true');
                // 使用单独的更新状态接口，避免触发标签删除逻辑
                // 前端发送当前状态值，后端负责切换
                $.ajax({
                    url: '/web-admin/archive/updateStatus',
                    type: "POST",
                    dataType: "json",
                    data: {
                        aid: id,
                        field: field,
                        value: currentValue  // 发送当前状态值，后端负责切换
                    },
                    success: function (res) {
                        if (res.code) {
                            window.CmsUI.failure(res.msg);
                            return;
                        }
                        refreshTable();
                        window.CmsUI.success('更新成功');
                    },
                    error: function () {
                        window.CmsUI.failure("请求失败");
                    },
                    complete: function () {
                        $this.data('busy',false).removeAttr('aria-disabled');
                    }
                });
            });
            $(document).on('keydown','.status-badge',function(event){if(event.key==='Enter'||event.key===' '){event.preventDefault();$(this).trigger('click');}});
        })

    </script>
</body>
