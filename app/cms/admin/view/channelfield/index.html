    <script src="<?= htmlspecialchars(\app\cms\AssetManifest::url('/app/admin/component/layui/layui.js?v=2.13.12'), ENT_QUOTES | ENT_SUBSTITUTE, 'UTF-8') ?>"></script>
    <script src="<?= htmlspecialchars(\app\cms\AssetManifest::url('/app/admin/component/pear/pear.js'), ENT_QUOTES | ENT_SUBSTITUTE, 'UTF-8') ?>"></script>
    <script src="<?= htmlspecialchars(\app\cms\AssetManifest::url('/app/admin/admin/js/permission.js'), ENT_QUOTES | ENT_SUBSTITUTE, 'UTF-8') ?>"></script>
    <script src="<?= htmlspecialchars(\app\cms\AssetManifest::url('/app/admin/admin/js/common.js'), ENT_QUOTES | ENT_SUBSTITUTE, 'UTF-8') ?>"></script>

    <script>

        // 相关常量
        const PRIMARY_KEY = "id";
        const SELECT_API = "/web-admin/channelfield/select" + location.search;
        const DELETE_API = "/web-admin/channelfield/delete";
        const UPDATE_API = "/web-admin/channelfield/update";
        const INSERT_URL = "/web-admin/channelfield/insert" + location.search;
        const UPDATE_URL = "/web-admin/channelfield/update";

        // 表格渲染
        layui.use(["table", "form", "pearCommon", "pearPopup", "util"], function () {
            let table = layui.table;
            let form = layui.form;
            let $ = layui.$;
            let common = layui.pearCommon;
            let util = layui.util;

            // 表头参数
            let cols = [
                {
                    type: "checkbox",
                    align: "center"
                }, {
                    title: "ID", align: "center",
                    field: "id",
                    width: 80,
                    sort: true,
                }, {
                    title: "字段标题", align: "left",
                    field: "title",
                    minWidth: 120,
                }, {
                    title: "所属模型", align: "center",
                    field: "channel_title",
                    width: 120,
                    templet: function (d) {
                        return d.channel_title || '通用';
                    }
                }, {
                    title: "字段名称", align: "left",
                    field: "name",
                    width: 150,
                }, {
                    title: "字段类型", align: "center",
                    field: "dtitle",
                    width: 120,
                    templet: function (d) {
                        // 优先显示 wa_field_type.title（dtitle），没有时回退显示 dtype
                        return d.dtitle || d.dtype || '';
                    }
                }, {
                    title: "创建时间", align: "center",
                    field: "add_time",
                    width: 160,
                    templet: function (d) {
                        if (!d.add_time) return '';
                        var date = new Date(d.add_time * 1000);
                        return date.getFullYear() + '-' + 
                               String(date.getMonth() + 1).padStart(2, '0') + '-' + 
                               String(date.getDate()).padStart(2, '0') + ' ' +
                               String(date.getHours()).padStart(2, '0') + ':' + 
                               String(date.getMinutes()).padStart(2, '0') + ':' + 
                               String(date.getSeconds()).padStart(2, '0');
                    }
                }, {
                    title: "操作",
                    toolbar: "#table-bar",
                    align: "center",
                    fixed: window.matchMedia("(max-width: 767px)").matches ? false : "right",
                    width: 280,
                }, {
                    title: "排序", align: "center",
                    field: "sort_order",
                    width: 100,
                    templet: function (d) {
                        return '<span class="sort-order-cell" data-id="' + d.id + '" data-value="' + (d.sort_order || 0) + '" style="cursor:pointer;padding:5px;display:inline-block;min-width:40px;">' + (d.sort_order || 0) + '</span>';
                    }
                }
            ];

            // 渲染表格
            window.CmsModuleNavigation.bindTable(table, 'data-table', ['field','order']);
            table.render({
                elem: "#data-table",
                url: SELECT_API,
                page: {curr: window.CmsModuleNavigation.tableState().curr},
                where: window.CmsModuleNavigation.tableState().where,
                cols: [cols],
                skin: "line",
                size: "lg",
                toolbar: "#table-toolbar",
                autoSort: false,
                id: "data-table",
                defaultToolbar: [{
                    title: "刷新",
                    layEvent: "refresh",
                    icon: "layui-icon-refresh",
                }, "filter", "print", "exports"]
            });

            // 编辑或删除行事件
            table.on("tool(data-table)", function (obj) {
                if (obj.event === "remove") {
                    remove(obj);
                } else if (obj.event === "edit") {
                    edit(obj);
                } else if (obj.event === "hide") {
                    hide(obj);
                } else if (obj.event === "tagCall") {
                    tagCall(obj);
                }
            });

            // 双击编辑排序
            $(document).on('dblclick', '.sort-order-cell', function(e) {
                e.stopPropagation(); // 阻止事件冒泡，避免触发编辑事件
                var $this = $(this);
                var id = $this.data('id');
                var oldValue = $this.data('value') || 0;
                var $input = $('<input type="number" class="layui-input" value="' + oldValue + '" style="width:80px;text-align:center;">');
                $this.html($input);
                $input.focus().select();
                
                $input.on('blur', function() {
                    var newValue = parseInt($(this).val()) || 0;
                    updateSortOrder(id, newValue, function() {
                        $this.data('value', newValue);
                        $this.text(newValue);
                        window.CmsUI.success('更新成功');
                    }, function() {
                        $this.text(oldValue);
                    });
                });
                
                $input.on('keydown', function(e) {
                    e.stopPropagation(); // 阻止事件冒泡
                    if (e.keyCode === 13) { // Enter
                        $(this).blur();
                    } else if (e.keyCode === 27) { // ESC
                        $this.text(oldValue);
                    }
                });
            });

            // 表格顶部工具栏事件
            table.on("toolbar(data-table)", function (obj) {
                if (obj.event === "add") {
                    add();
                } else if (obj.event === "refresh") {
                    refreshTable();
                } else if (obj.event === "batchRemove") {
                    batchRemove(obj);
                }
            });

            // 表格顶部搜索事件
            form.on("submit(table-query)", function (data) {
                table.reload("data-table", {
                    page: {
                        curr: 1
                    },
                    where: data.field || {}
                })
                return false;
            });

            // 表格顶部搜索重置事件
            form.on("submit(table-reset)", function (data) {
                table.reload("data-table", {
                    where: {}
                })
            });

            // 表格新增数据
            let add = function () {
                cmsOpenEditor(INSERT_URL);
            }

            // 表格编辑数据
            let edit = function (obj) {
                let value = obj.data[PRIMARY_KEY];
                var channelId = new URLSearchParams(location.search).get('channel_id') || '';
                cmsOpenEditor(UPDATE_URL + "?" + PRIMARY_KEY + "=" + value + (channelId ? "&channel_id=" + channelId : ""));
            }

            // 隐藏/显示字段
            let hide = function (obj) {
                var id = obj.data[PRIMARY_KEY];
                if (!id) {
                    window.CmsUI.failure("ID不能为空");
                    return;
                }
                var ifeditable = obj.data.ifeditable || 0;
                var newIfeditable = ifeditable == 1 ? 0 : 1;
                var newText = newIfeditable == 0 ? '显示' : '隐藏';
                
                // 立即更新表格数据
                obj.data.ifeditable = newIfeditable;
                obj.update({
                    ifeditable: newIfeditable
                });
                
                // 立即更新按钮文字（直接操作 DOM）
                var $btn = $(obj.tr).find('button[lay-event="hide"]');
                if ($btn.length > 0) {
                    $btn.text(newText);
                }
                
                var loadingIndex = layer.load();
                $.ajax({
                    url: UPDATE_API,
                    data: {
                        id: id,
                        ifeditable: newIfeditable
                    },
                    dataType: "json",
                    type: "post",
                    success: function (res) {
                        layer.close(loadingIndex);
                        if (res.code) {
                            // 请求失败，恢复原来的状态
                            obj.data.ifeditable = ifeditable;
                            obj.update({
                                ifeditable: ifeditable
                            });
                            var oldText = ifeditable == 0 ? '显示' : '隐藏';
                            $btn.text(oldText);
                            return window.CmsUI.failure(res.msg);
                        }
                        window.CmsUI.success("操作成功");
                    },
                    error: function(xhr, status, error) {
                        layer.close(loadingIndex);
                        // 请求失败，恢复原来的状态
                        obj.data.ifeditable = ifeditable;
                        obj.update({
                            ifeditable: ifeditable
                        });
                        var oldText = ifeditable == 0 ? '显示' : '隐藏';
                        $btn.text(oldText);
                        window.CmsUI.failure("请求失败: " + error);
                    }
                });
            }

            // 标签调用
            let tagCall = function (obj) {
                var fieldName = obj.data.name || '';
                window.CmsUI.layer({
                    type: 2,
                    title: "标签调用",
                    shade: 0.1,
                    maxmin: false,
                    kind: 'picker', area: ['1040px', '85vh'],
                    content: "/web-admin/channelfield/tagCall?field_name=" + encodeURIComponent(fieldName)
                });
            }

            // 更新排序
            let updateSortOrder = function (id, sortOrder, successCallback, errorCallback) {
                $.ajax({
                    url: UPDATE_API,
                    data: {
                        id: id,
                        sort_order: sortOrder
                    },
                    dataType: "json",
                    type: "post",
                    success: function (res) {
                        if (res.code) {
                            if (errorCallback) errorCallback();
                            return window.CmsUI.failure(res.msg);
                        }
                        if (successCallback) successCallback();
                        refreshTable();
                    },
                    error: function() {
                        if (errorCallback) errorCallback();
                        window.CmsUI.failure('更新失败');
                    }
                });
            }

            // 删除一行
            let remove = function (obj) {
                return doRemove(obj.data[PRIMARY_KEY]);
            }

            // 删除多行
            let batchRemove = function (obj) {
                let checkIds = common.checkField(obj, PRIMARY_KEY);
                if (checkIds === "") {
                    window.CmsUI.warning("未选中数据");
                    return false;
                }
                doRemove(checkIds.split(","));
            }

            // 执行删除
            let doRemove = function (ids) {
                let data = {};
                data[PRIMARY_KEY] = ids;
                window.CmsUI.confirm("确认删除所选记录？请核对选择；删除后的恢复方式以该模块规则为准。", {title: "确认删除", confirmText: "确认删除"}).then(function(approved) {
                        if(!approved)return;
                    let loading = layer.load();
                    $.ajax({
                        url: DELETE_API,
                        data: data,
                        dataType: "json",
                        type: "post",
                        success: function (res) {
                            layer.close(loading);
                            if (res.code) {
                                return window.CmsUI.failure(res.msg);
                            }
                            return window.CmsUI.success("操作成功", refreshTable);
                        }
                    })
                });
            }

            // 刷新表格数据
            window.refreshTable = function () {
                table.reloadData("data-table", {
                    scrollPos: "fixed",
                    done: function (res, curr) {
                        if (curr > 1 && res.data && !res.data.length) {
                            curr = curr - 1;
                            table.reloadData("data-table", {
                                page: {
                                    curr: curr
                                },
                            })
                        }
                    }
                });
            }
        })

    </script>

<script>
function cmsOpenEditor(href) {
    window.CmsModuleNavigation?.capture();
    const target=new URL(href,location.href),source=new URL(location.href);
    const language=window.CmsEditContext?.get()?.edit||source.searchParams.get('lang')||window.CmsLanguageInitial?.lang;
    if(language)target.searchParams.set('lang',language);
    target.searchParams.set('return',source.pathname+source.search);
    location.assign(target.pathname+target.search);
}
</script>
