<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>批量新增栏目</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#263244;font:14px/1.6 system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:20px 24px 94px}header{display:flex;align-items:center;gap:12px;margin-bottom:18px}h1{margin:0;font-size:20px}h2{margin:0 0 14px;font-size:15px}.back{display:grid;place-items:center;width:34px;height:34px;background:#fff;border:1px solid #e0e5ed;border-radius:7px;color:inherit}.back svg{width:19px;height:19px}.hint{margin:5px 0;color:#738095;font-size:13px}.card{padding:20px;background:#fff;border:1px solid #e6eaf0;border-radius:9px;margin-bottom:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}label{display:grid;gap:7px;font-weight:500}input,select,textarea,button{font:inherit}select,textarea{width:100%;padding:9px 11px;border:1px solid #d7dfe9;border-radius:6px;background:#fff;color:inherit}textarea{min-height:220px;resize:vertical;font:13px/1.8 ui-monospace,monospace}code{background:#f3f6fa;padding:2px 5px;border-radius:3px}button{padding:8px 16px;border:1px solid #d7dfe9;border-radius:6px;background:#fff;color:#344256;cursor:pointer}.primary{background:#1677ff;border-color:#1677ff;color:#fff}button:disabled{opacity:.5;cursor:not-allowed}.footer{position:fixed;inset:auto 0 0;z-index:20;background:#fff;border-top:1px solid #e5eaf1;display:flex;justify-content:center;gap:12px;padding:13px 20px}.status{white-space:pre-wrap;margin:12px 0 0;color:#a84622;outline:none}.status.success{color:#20814a}.table-scroll{max-width:100%;overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:left;padding:10px;border-bottom:1px solid #e9edf3}th{background:#f7f9fc;font-size:13px;color:#66758b}.summary{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:12px}.summary strong{color:#1677ff}.progress{padding:12px;border:1px solid #b9d8ff;border-radius:6px;background:#f3f8ff;color:#175baa;margin-top:12px}[hidden]{display:none!important}@media(max-width:600px){main{padding:15px 12px 100px}.card{padding:16px}.grid{grid-template-columns:1fr;gap:14px}.footer{padding:12px;gap:7px}.footer button{padding:8px 10px}h1{font-size:18px}}
</style></head><body data-cms-editor data-cms-record-kind="category-batch">
<main><header><a class="back" href="/web-admin/arctype/index" data-back aria-label="返回栏目列表"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg></a><div><h1>批量新增栏目</h1><p class="hint">先核对栏目、目录及语言范围，再一次性创建。</p></div></header>
<form id="batch-form" class="card"><h2>栏目设置</h2><div class="grid"><label>所属栏目<select id="parent"><option value="0">顶级栏目</option></select></label><label>内容模型<select id="model"></select></label></div><label style="margin-top:18px">栏目清单<textarea id="items" spellcheck="false" placeholder="新闻中心|news&#10;公司新闻|company-news|1&#10;行业资讯|industry-news|1" aria-describedby="items-help"></textarea></label><p id="items-help" class="hint">每行一个栏目，格式：<code>栏目名称|目录名称|上级行号</code>。目录可留空自动生成；上级行号只能指向前面的行，留空则使用上方“所属栏目”。最多100行。</p><p class="hint">当前编辑语言：<strong id="language"></strong>。共享结构启用时，预检会列出全部受影响语言。只创建栏目结构，单页正文保持为空。</p></form>
<section id="preview" class="card" hidden aria-labelledby="preview-title"><h2 id="preview-title">创建清单</h2><div class="summary" id="summary"></div><div class="table-scroll"><table><thead><tr><th>行号</th><th>栏目名称</th><th>所属栏目</th><th>目录</th><th>内容模型</th></tr></thead><tbody id="rows"></tbody></table></div><p class="hint" id="affected"></p></section>
<section class="card"><p id="status" class="status" role="status" tabindex="-1" aria-live="polite">填写栏目清单后，点击“预检创建清单”。</p><p id="progress" class="progress" role="status" aria-live="polite" hidden></p></section>
</main><footer class="footer"><button type="button" data-back>返回列表</button><button type="button" id="check" class="primary">预检创建清单</button><button type="button" id="run" class="primary" disabled>确认创建</button><button type="button" id="recover" hidden>检查任务状态</button></footer>
<script>
(()=>{'use strict';
const initial=<?= json_encode(['models'=>$batchModels,'categories'=>$batchCategories,'language'=>$batchLanguage], JSON_HEX_TAG|JSON_HEX_AMP|JSON_HEX_APOS|JSON_HEX_QUOT|JSON_UNESCAPED_UNICODE) ?>;
const $=id=>document.getElementById(id),form=$('batch-form');let plan=null,busy=false,completed=false;
function option(select,value,label){const o=document.createElement('option');o.value=value;o.textContent=label;select.append(o)}
initial.models.forEach(v=>option($('model'),v.id,v.title));initial.categories.forEach(v=>option($('parent'),v.id,'　'.repeat(Math.min(10,Number(v.grade)||0))+v.typename));$('language').textContent=initial.language;
function state(text,success=false){$('status').textContent=text;$('status').classList.toggle('success',success)}
function setBusy(on,message=''){busy=on;document.body.toggleAttribute('data-cms-submit-busy',on);form.setAttribute('aria-busy',String(on));form.querySelectorAll('input,textarea,select').forEach(n=>n.disabled=on||completed);$('check').disabled=on||completed;$('run').disabled=on||!plan||completed;$('recover').disabled=on;$('progress').hidden=!on;$('progress').textContent=message;document.querySelectorAll('[data-back]').forEach(n=>n.setAttribute('aria-disabled',String(on)))}
function invalidate(){if(busy)return;plan=null;completed=false;$('run').disabled=true;$('preview').hidden=true;$('recover').hidden=true;state('栏目设置已变化，请重新预检。')}
form.addEventListener('input',invalidate);form.addEventListener('change',invalidate);form.onsubmit=e=>e.preventDefault();
function items(){return $('items').value.split(/\r?\n/).filter(line=>line.trim()).map((line,i)=>{const p=line.split('|');if(p.length>3)throw new Error('第'+(i+1)+'行格式错误，请使用“栏目名称|目录名称|上级行号”');return {typename:(p[0]||'').trim(),dirname:(p[1]||'').trim(),parent_row:(p[2]||'0').trim()}})}
async function api(action,body){const options={credentials:'same-origin',headers:{'X-Requested-With':'XMLHttpRequest'}};if(body){options.method='POST';options.body=body;options.headers['X-CMS-CSRF']=window.CmsLanguageInitial?.csrf||''}const response=await fetch('/web-admin/arctype/'+action,options);let data;try{data=await response.json()}catch(_){throw new Error('服务响应中断，请检查任务状态后重试')}if(data.code!==0)throw new Error(data.msg||'操作未完成');return data.data}
function showPlan(value){plan=value;$('rows').replaceChildren();value.items.forEach(item=>{const tr=document.createElement('tr');[item.row,item.typename,item.parent_title,item.dirname,item.model_title].forEach(text=>{const td=document.createElement('td');td.textContent=text;tr.append(td)});$('rows').append(tr)});$('summary').textContent='本次输入 '+value.counts.requested+' 个栏目，预计创建 '+value.counts.create+' 个栏目、'+value.counts.single_pages+' 个空单页。';$('affected').textContent='受影响语言：'+value.affected_languages.join('、')+'。已有栏目及文档不会替换。';$('preview').hidden=false;$('run').disabled=false}
function done(value){completed=true;plan=value;$('recover').hidden=true;$('run').disabled=true;window.CmsUI?.clean(form);state('已创建 '+value.counts.created+' 个栏目（本次输入 '+value.counts.requested+' 个），失败 '+value.counts.failed+' 个，跳过 '+value.counts.skipped+' 个。可返回栏目列表查看。',true);$('status').focus()}
$('check').onclick=async()=>{if(busy)return;plan=null;$('run').disabled=true;setBusy(true,'正在检查目录、模型、栏目关联与权限…');try{const body=new FormData();body.append('parent_id',$('parent').value);body.append('current_channel',$('model').value);body.append('items',JSON.stringify(items()));const value=await api('batchPreview',body);showPlan(value);state('预检完成，请核对清单后确认创建。');$('preview').scrollIntoView({block:'nearest'})}catch(error){state(error.message);$('status').focus()}finally{setBusy(false)}};
$('run').onclick=async()=>{if(busy||!plan||completed)return;const allowed=window.CmsUI?await window.CmsUI.confirm('将为 '+plan.affected_languages.join('、')+' 创建 '+plan.counts.create+' 个栏目。请确认预检清单。',{title:'确认批量新增栏目',confirmText:'确认创建',cancelText:'继续核对'}):false;if(!allowed)return;setBusy(true,'正在创建栏目及语言关联，请勿重复提交…');try{const body=new FormData();body.append('plan_token',plan.token);done(await api('batchRun',body))}catch(error){state(error.message);$('recover').hidden=false;$('status').focus()}finally{setBusy(false)}};
$('recover').onclick=async()=>{if(busy||!plan)return;setBusy(true,'正在读取任务结果…');try{const value=await api('batchStatus?plan_token='+encodeURIComponent(plan.token));if(value.status==='complete')done(value);else state('本任务尚未提交成功，可以重新点击“确认创建”。相同任务不会重复创建栏目。')}catch(error){state(error.message)}finally{setBusy(false)}};
document.querySelectorAll('[data-back]').forEach(n=>n.addEventListener('click',async event=>{event.preventDefault();if(busy)return;if(!completed&&$('items').value.trim()&&window.CmsUI&&!await window.CmsUI.confirm('当前栏目清单尚未创建，确定返回列表？',{title:'返回栏目列表',confirmText:'返回列表',cancelText:'继续编辑'}))return;window.CmsUI?.clean(form);location.href='/web-admin/arctype/index'}));
})();
</script></body></html>
