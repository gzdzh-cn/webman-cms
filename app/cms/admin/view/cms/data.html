<script>
const config=<?= json_encode(['schema'=>$schema,'module'=>$module,'primary'=>$primary,'endpoint'=>$endpoint,'ui'=>$ui,'lookup'=>$lookup,'initial'=>$initial,'permissions'=>$permissions,'recycle_enabled'=>$module==='guestbook_attribute'?(new \app\cms\service\RecyclePolicyService())->enabled():false,'editor'=>$editorView,'record'=>$editorRecord],JSON_HEX_TAG|JSON_HEX_AMP|JSON_HEX_APOS|JSON_HEX_QUOT|JSON_UNESCAPED_UNICODE) ?>;
const $=selector=>document.querySelector(selector),el=(tag,text)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n;};
const {schema,module:moduleName,primary,endpoint,ui,lookup,permissions}=config,readonly=ui.readonly||config.editor==='detail';let page=Math.max(1,Number(new URLSearchParams(location.search).get('page'))||1),total=0,records=[],saving=false,loading=false,uploads=0;
function status(text){$('#status').textContent=text;}
function options(name,record={}){if(lookup[name])return lookup[name].filter(item=>item.kind===undefined||Number(item.kind)===Number(record.form_type??0));return Object.entries(ui.definitions[name]?.options||{}).map(([value,label])=>({value,label}));}
function optionLabel(name,value,record){const found=options(name,record).find(item=>String(item.value)===String(value));return found?found.label:((value===null||value==='')?'未设置':'未知值（'+value+'）');}
function dateText(value){if(!Number(value))return '未设置';const d=new Date(Number(value)*1000);return isNaN(d)?'无效时间':d.toLocaleString('zh-CN',{hour12:false});}
function imageUrl(value){try{const u=new URL(value,location.href);return ['http:','https:'].includes(u.protocol)?u.href:null;}catch(_){return null;}}
function cell(name,record){const value=record[name],definition=ui.definitions[name]||{},td=el('td');td.title=String(value??'');
 if(name==='_submission'){td.textContent=(record.fields||[]).filter(f=>Number(f.is_showlist)===1).map(f=>f.attr_name+'：'+f.attr_value).join('；')||'查看留言内容';return td;}
 if(lookup[name]||definition.options){const text=optionLabel(name,value,record);if(definition.options){const badge=el('span',text);badge.className='cms-ui-badge '+(Number(value)===1?'on':Number(value)===0?'off':'');td.append(badge);}else td.textContent=text;}
 else if(definition.type==='datetime')td.textContent=Number(value)?dateText(value):(definition.zero||'未设置');
 else if(definition.type==='size'){const n=Number(value);td.textContent=!Number.isFinite(n)||n<0?'未知':n>=1048576?(n/1048576).toFixed(2)+' MB':n>=1024?(n/1024).toFixed(1)+' KB':n+' B';}
 else if(definition.type==='image'&&value&&imageUrl(value)){const img=el('img');img.src=imageUrl(value);img.alt=String(record.title||record.file_name||'图片预览');img.className='cms-ui-thumb';img.loading='lazy';td.append(img);}
 else if(value&&['url','nav_url','file_url','links','log_url'].includes(name)&&imageUrl(value)){const link=el('a',String(value));link.href=imageUrl(value);link.target='_blank';link.rel='noopener';link.className='cms-data-address';link.title=String(value);td.append(link);const copy=el('button','复制');copy.type='button';copy.className='cms-copy-action';copy.setAttribute('aria-label','复制'+(definition.label||'地址'));copy.onclick=async()=>{try{await navigator.clipboard.writeText(String(value));copy.textContent='已复制';}catch(_){status('复制失败，请打开地址后手动复制。');}};td.append(copy);}
 else td.textContent=value===null||value===''||value===undefined?'—':String(value);return td;}
function listUrl(){const u=new URL(location.href);u.searchParams.delete('view');u.searchParams.delete('record');u.searchParams.delete('return');return u.pathname+u.search;}
function openRecord(record={}){const existing=!!record[primary];if(ui.page){window.CmsModuleNavigation?.capture();const u=new URL(endpoint+'/index',location.origin);u.searchParams.set('view',existing?(readonly||!permissions.save?'detail':'edit'):'create');if(existing)u.searchParams.set('record',record[primary]);const lang=new URL(location.href).searchParams.get('lang');if(lang)u.searchParams.set('lang',lang);u.searchParams.set('return',listUrl());location.assign(u.pathname+u.search);return;}buildForm({...config.initial,...record});$('#dialog').showModal();}
async function load(){if(loading)return;loading=true;$('#rows').setAttribute('aria-busy','true');status('正在读取…');try{const remembered={page,q:$('#search').value};document.querySelectorAll('[data-cms-list-filter]').forEach(input=>remembered[input.name]=input.value);window.CmsModuleNavigation?.remember(remembered);const params=new URLSearchParams(location.search);params.set('page',page);params.set('limit',20);params.set('q',$('#search').value);document.querySelectorAll('[data-cms-list-filter]').forEach(input=>{if(input.value!=='')params.set(input.name,input.value);else params.delete(input.name);});const response=await fetch(endpoint+'/select?'+params,{headers:{Accept:'application/json'}});const result=await response.json();if(result.code!==0)throw Error(result.msg||'读取失败');total=result.count;records=result.data;$('#rows').replaceChildren();for(const record of records){const tr=el('tr');ui.columns.forEach(name=>tr.append(cell(name,record)));const actions=el('td');if(permissions.select){const edit=el('button',readonly||!permissions.save?'查看':'编辑');edit.onclick=()=>{if(!permissions.save&&!readonly&&!ui.page){buildForm(record,true);$('#dialog').showModal();}else openRecord(record);};actions.append(edit);}if(!readonly&&permissions.delete){const remove=el('button','删除');remove.className='cms-danger-action';remove.onclick=()=>removeRecord(record);actions.append(remove);}tr.append(actions);$('#rows').append(tr);}if(!records.length){const tr=el('tr'),td=el('td', '暂无'+ui.title+'，可调整查询条件'+(permissions.save&&!readonly&&moduleName!=='guestbook'?'或新增一条。':'。'));td.colSpan=ui.columns.length+1;td.className='cms-ui-table-empty';tr.append(td);$('#rows').append(tr);}$('#page').textContent=`第 ${page} 页 · 共 ${total} 条`;$('#previous').disabled=page<=1;$('#next').disabled=page*20>=total;status('');}catch(error){status(error.message+'；请点击查询重试。');}finally{loading=false;$('#rows').removeAttribute('aria-busy');}}
function buildForm(record={},forceReadonly=false){
 const form=$('#form'),locked=readonly||forceReadonly;form.replaceChildren();form.dataset.cmsDirty='0';if($('#form-title'))$('#form-title').textContent=(locked?'查看':record[primary]?'编辑':'新增')+ui.title;
 const id=el('input');id.type='hidden';id.name=primary;id.value=record[primary]||'';form.append(id);
 if(moduleName==='guestbook'){const detail=el('section');detail.className='record-detail';detail.append(el('strong','提交内容'));for(const field of record.fields||[])detail.append(el('p',field.attr_name+'：'+field.attr_value));detail.append(el('p','提交时间：'+dateText(record.add_time)+'　IP：'+(record.ip||'未记录')));form.append(detail);}
 const fieldGroups=new Map();for(const group of ui.groups||[]){const section=el(group.advanced?'details':'section');section.className='cms-data-section';section.append(el(group.advanced?'summary':'h2',group.title));const body=el('div');body.className='cms-data-fields';section.append(body);form.append(section);for(const name of group.fields)fieldGroups.set(name,body);}
 for(const name of ui.fields){if(name===primary)continue;const definition=ui.definitions[name]||{},column=schema[name],wrapper=el('label',definition.label);let input;
 const original=Object.prototype.hasOwnProperty.call(record,name),value=original?record[name]:(column.Default??'');
 if(lookup[name]||definition.options){input=el('select');input.append(new Option('请选择',''));for(const option of options(name,record))input.append(new Option(option.label,String(option.value)));if(value!==null&&value!==''&&!Array.from(input.options).some(o=>o.value===String(value))){if(original)input.append(new Option('未知值（'+value+'），保留原值',String(value)));else if(input.options.length>1)input.value=input.options[1].value;}if(original||Array.from(input.options).some(o=>o.value===String(value)))input.value=String(value??'');}
 else if(definition.type==='textarea'){input=el('textarea');input.value=value??'';wrapper.className='wide';}
 else{input=el('input');input.type=definition.type==='datetime'?'datetime-local':['number','email','url'].includes(definition.type)?definition.type:'text';if(input.type==='url')input.type='text';if(definition.type==='datetime'){input.step='1';if(Number(value)>0){const date=new Date(Number(value)*1000);input.value=new Date(date.getTime()-date.getTimezoneOffset()*60000).toISOString().slice(0,19);}}else input.value=value??'';if(input.type==='number')input.step='any';}
 input.name=name;input.id='field-'+name;if(locked)input.tagName==='SELECT'?input.disabled=true:input.readOnly=true;
 if(!locked&&['title','group_name','nav_name','position_name','form_name','attr_name','tag','tpl_title','word'].includes(name))input.required=true;
 wrapper.append(input);if(definition.help)wrapper.append(el('small',definition.help));if(definition.type==='datetime')wrapper.append(el('small','留空表示'+(definition.zero||'未设置')));
 if(!locked&&['image','file'].includes(definition.type)){const tools=el('div');tools.className='cms-ui-input-action';const upload=el('input');upload.type='file';upload.setAttribute('aria-label','上传'+definition.label);if(definition.type==='image')upload.accept='image/*';upload.onchange=()=>uploadFile(upload,input,form);tools.append(upload);const select=el('button','选择已有文件');select.type='button';select.onclick=()=>selectFile(input,form);tools.append(select);wrapper.append(tools);}
 (fieldGroups.get(name)||form).append(wrapper);
 }
 const actions=el('div');actions.className='actions';const cancel=el('button',config.editor?'返回列表':'取消');cancel.type='button';cancel.onclick=()=>config.editor?window.CmsUI.back():$('#dialog').close();actions.append(cancel);if(!locked){const save=el('button','保存');save.type='submit';save.className='primary';actions.append(save);}form.append(actions);
 const formType=form.querySelector('[name=form_type]');if(moduleName==='guestbook_attribute'&&formType)formType.onchange=()=>{const input=form.querySelector('[name=typeid]');input.replaceChildren(new Option('请选择',''));for(const item of options('typeid',{form_type:formType.value}))input.append(new Option(item.label,String(item.value)));window.CmsUI.dirty(form);};
 form.onsubmit=saveForm;window.CmsUI.clean(form);
}
async function selectFile(input,form){try{if(!window.layui?.layer)await new Promise(resolve=>layui.use('layer',resolve));window.CmsUI.layer({kind:'picker',type:2,title:'选择文件',content:'/web-admin/upload/attachment',success:layero=>{layero.data('callback',data=>{input.value=data.url||'';input.dispatchEvent(new Event('input',{bubbles:true}));window.CmsUI.dirty(form);});}});}catch(error){window.CmsUI.error(form,error.message);}}
async function uploadFile(control,input,form){if(!control.files[0])return;uploads++;control.disabled=true;form.dataset.cmsUploadBusy='1';window.CmsUI.dirty(form);try{const body=new FormData();body.append('file',control.files[0]);const result=await post('/web-admin/upload/file',body);input.value=result.data.url;input.dispatchEvent(new Event('input',{bubbles:true}));const filename=form.querySelector('[name=file_name]');if(filename&&!filename.value)filename.value=result.data.name||control.files[0].name;window.CmsUI.dirty(form);}catch(error){window.CmsUI.error(form,error.message);}finally{control.disabled=false;uploads--;if(!uploads)delete form.dataset.cmsUploadBusy;}}
async function post(url,body){let response;try{response=await fetch(url,{method:'POST',headers:{Accept:'application/json'},body});}catch(_){throw Error('网络连接失败，当前输入已保留，请稍后重试。');}let result;try{result=await response.json();}catch(_){throw Error('服务响应无法读取，当前输入已保留，请检查登录状态后重试。');}if(!response.ok||result.code!==0){const error=Error(result.code===401?'登录已失效，请重新登录后保存，当前输入已保留。':result.msg||'操作失败');error.fields=result.fields||result.data?.fields||{};throw error;}return result;}
async function saveForm(event){event.preventDefault();if(saving)return;const form=event.currentTarget;if(uploads){window.CmsUI.error(form,'文件正在上传，请上传完成后再保存。');return;}if(!form.reportValidity())return;const body=new FormData(form);form.querySelectorAll('input[type=datetime-local][name]').forEach(input=>body.set(input.name,input.value?Math.floor(new Date(input.value).getTime()/1000):0));saving=true;window.CmsUI.setBusy(form,true);try{const result=await post(endpoint+'/save',body);window.CmsUI.clean(form);window.CmsUI.setBusy(form,false);const warnings=[result.data?.cache_warning,result.data?.publication_warning,result.msg&&result.msg!=='保存成功'&&result.msg!=='ok'?result.msg:''].filter(Boolean);if(warnings.length){window.CmsUI.error(form,'数据已保存：'+warnings.join('；'));return;}if(config.editor)window.CmsUI.saved(endpoint+'/index');else{window.CmsUI.success(result.msg||'保存成功');$('#dialog').close();await load();}}catch(error){window.CmsUI.error(form,error.message,error.fields);}finally{saving=false;window.CmsUI.setBusy(form,false);}}
async function removeRecord(record){const name=record.title||record.nav_name||record.form_name||record.tag||record.word||record.file_name||record[primary];const cascades={ad_position:'将同时删除该位置下的广告。',links_group:'将同时删除该分组下的链接。',form:'将同时删除表单字段和提交记录。',guestbook:'将同时删除该留言的提交内容。'};const recycle=moduleName==='guestbook_attribute'?(config.recycle_enabled?'移入回收站，可恢复。':'回收站已关闭，将彻底删除字段和历史字段值，无法恢复。'):'删除后无法通过此列表恢复。';const impact=Object.entries(record._ui_delete_impact||{}).map(([name,count])=>name+' '+count+'条').join('、');if(!await window.CmsUI.confirm('对象：'+name+'（ID '+record[primary]+'）\n数量：1条\n'+(cascades[moduleName]||'')+(impact?'\n当前关联：'+impact+'。\n':'')+recycle,{title:'删除'+ui.title,danger:true,confirmText:'确认删除'}))return;try{const body=new FormData();body.append('ids[]',record[primary]);if(moduleName==='guestbook_attribute')body.set('recycle_enabled',config.recycle_enabled?'1':'0');await post(endpoint+'/delete',body);await load();}catch(error){status(error.message);}}
function start(){if(config.editor){buildForm(config.record||config.initial);return;}$('#search').value=new URLSearchParams(location.search).get('q')||'';const header=el('tr');ui.columns.forEach(name=>header.append(el('th',ui.definitions[name].label)));header.append(el('th','操作'));$('#head').append(header);const filterKey=['status','is_read','is_open','is_hot'].find(key=>schema[key]&&ui.definitions[key]?.options);if(filterKey){const select=el('select');select.name=filterKey;select.dataset.cmsListFilter='1';select.setAttribute('aria-label',ui.definitions[filterKey].label+'筛选');select.append(new Option('全部'+ui.definitions[filterKey].label,''));for(const option of options(filterKey))select.append(new Option(option.label,String(option.value)));select.value=new URL(location.href).searchParams.get(filterKey)||'';$('#find').before(select);select.onchange=()=>{page=1;load();};}$('#create').hidden=!permissions.save||readonly||moduleName==='guestbook';$('#create').onclick=()=>openRecord();$('#find').onclick=()=>{page=1;load();};$('#reset').onclick=()=>{$('#search').value='';document.querySelectorAll('[data-cms-list-filter]').forEach(input=>input.value='');page=1;load();};$('#search').onkeydown=event=>{if(event.key==='Enter'){page=1;load();}};$('#previous').onclick=()=>{page--;load();};$('#next').onclick=()=>{page++;load();};load();}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start();
</script></body></html>
