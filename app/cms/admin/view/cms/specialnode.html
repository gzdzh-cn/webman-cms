<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>专题节点</title><style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#f3f5f8;color:#25304a;font:14px system-ui,sans-serif}main{background:#fff;border-radius:10px;padding:24px}h1{font-size:22px;margin:0 0 18px}button,input,select,textarea{font:inherit}button{padding:8px 13px;background:#fff;border:1px solid #d7dce3;border-radius:5px;cursor:pointer}button.primary{background:#2369d8;color:#fff}button.danger{color:#b52828}button:disabled{opacity:.5;cursor:not-allowed}input,select,textarea{padding:8px;border:1px solid #d7dce3;border-radius:5px;max-width:100%}label{display:grid;gap:6px}header,.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}.node{padding:18px;margin-top:16px;border:1px solid #d7dce3;border-radius:8px}.grid{display:grid;grid-template-columns:repeat(3,minmax(120px,1fr));gap:14px}.wide{grid-column:1/-1}textarea{width:100%;min-height:65px}.hint{color:#6b7280;margin:10px 0;font-size:13px}.status{color:#a52a2a;white-space:pre-wrap}table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:9px;border-bottom:1px solid #eee}dialog{border:0;border-radius:10px;padding:24px;width:min(900px,94vw);max-height:88vh;overflow:auto}dialog::backdrop{background:#0006}.picked{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:7px 0}.picked input{width:100px}@media(max-width:700px){body{padding:12px}.grid{grid-template-columns:1fr}.wide{grid-column:auto}}
</style><link rel="stylesheet" href="<?= htmlspecialchars(\app\cms\AssetManifest::url('/app/admin/admin/css/cms-content-pages.css?v=20261105-content1'), ENT_QUOTES | ENT_SUBSTITUTE, 'UTF-8') ?>"><link rel="stylesheet" href="<?= htmlspecialchars(\app\cms\AssetManifest::url('/app/admin/admin/css/cms-page-adapters.css?v=20261105-adapters1'), ENT_QUOTES | ENT_SUBSTITUTE, 'UTF-8') ?>">
<link rel="stylesheet" href="<?= htmlspecialchars(\app\cms\AssetManifest::url('/app/admin/admin/css/cms-module-navigation.css?v=20261106-basic2'), ENT_QUOTES | ENT_SUBSTITUTE, 'UTF-8') ?>"><script src="<?= htmlspecialchars(\app\cms\AssetManifest::url('/app/admin/admin/js/cms-module-navigation.js?v=20261106-basic2'), ENT_QUOTES | ENT_SUBSTITUTE, 'UTF-8') ?>"></script>
</head><body class="cms-content-page cms-content-specialnode cms-page-adapted"><div data-cms-module-navigation></div><h1>专题管理</h1><main class="cms-page-panel"><header class="cms-filterbar" data-cms-filter><label>语言<select id="language"></select></label><label>专题<select id="topic"></select></label><button id="load">读取节点</button></header><p id="owner" class="hint"></p><p class="hint">标识和名称供 specnode / specnodelist 标签读取。节点排序小的靠前；手选文档按文档排序升序保存。自动节点使用栏目、关键词及条数读取文档。</p><div class="actions cms-filterbar cms-actionbar" data-cms-filter><button id="add">添加节点</button><button class="primary cms-primary-action" id="save">保存全部节点</button><span id="count"></span></div><p id="status" class="status" role="status" aria-live="polite"></p><form id="nodes-form" onsubmit="return false"><div id="nodes"></div></form></main>
<dialog id="picker" data-cms-dialog-kind="picker"><h2>选择手选文档</h2><div class="actions"><input id="search" placeholder="搜索文档标题"><button id="find">搜索</button><button id="close-picker">完成</button></div><p class="hint">显示当前语言最近100条匹配企业文档；草稿可保留在节点中，前台按原标签审核状态过滤。</p><p id="picker-status" class="status"></p><table><thead><tr><th>ID</th><th>文档</th><th>操作</th></tr></thead><tbody id="results"></tbody></table></dialog>
<dialog id="remove-dialog" data-cms-dialog-kind="confirm"><h2>永久删除节点</h2><p id="remove-text"></p><p>删除后标签不再读取该节点，专题及其文档会保留。</p><label><span><input id="confirm-remove" type="checkbox"> 我确认永久删除这个节点</span></label><div class="actions" style="margin-top:20px"><button id="execute-remove" class="danger" disabled>永久删除</button><button id="cancel-remove">取消</button></div><p id="remove-status" class="status"></p></dialog>
<script>
function pageStatus(text,error=false){const node=document.querySelector('#status');node.textContent=text;node.dataset.error=String(error);}

const $=s=>document.querySelector(s),params=new URLSearchParams(location.search);let lang=params.get('lang')||'cn',aid=Number(params.get('aid')||0),permissions={save:false,delete:false},categories=[],activePicker=null,pendingRemove=null,loadingVersion=0;
const el=(tag,text)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n};
const btn=(text,action,cls='')=>{const n=el('button',text);n.type='button';n.className=cls;n.onclick=action;return n};
const pendingWrites=new WeakMap();
async function withPendingWrite(enabled,run){if(!enabled)return run();const roots=[document.body,...document.querySelectorAll('dialog[open]')];roots.forEach(root=>{pendingWrites.set(root,(pendingWrites.get(root)||0)+1);root.setAttribute('data-cms-submit-busy','');root.setAttribute('aria-busy','true')});try{return await run()}finally{roots.forEach(root=>{const count=(pendingWrites.get(root)||1)-1;if(count)pendingWrites.set(root,count);else{pendingWrites.delete(root);root.removeAttribute('data-cms-submit-busy');root.removeAttribute('aria-busy')}})}}
async function api(...args){return !!args[1]&&args[0]==='save'?window.CmsUI.persist(()=>rawSaveRequest(...args)):rawSaveRequest(...args);}
async function rawSaveRequest(action,data){return withPendingWrite(!!data,async()=>{const response=await fetch('/web-admin/specialnode/'+action,data?{method:'POST',body:data}:{});let result;try{result=await response.json()}catch(e){throw Error('后台接口响应异常（'+response.status+'）')}if(!response.ok||result.code!==0)throw Error(result.msg||'操作失败');return result.data})}
function query(extra={}){return new URLSearchParams({aid,lang,...extra})}
function syncUrl(){const url=new URL(location.href);url.searchParams.set('lang',lang);if(aid)url.searchParams.set('aid',aid);else url.searchParams.delete('aid');history.replaceState(null,'',url)}
function option(select,value,text){const n=el('option',text);n.value=value;select.append(n)}
async function topics(){try{const data=await api('topics?'+new URLSearchParams({lang}));$('#language').replaceChildren();data.languages.forEach(v=>option($('#language'),v.mark,v.title+' ('+v.mark+')'));$('#language').value=lang;$('#topic').replaceChildren();option($('#topic'),'','请选择专题');data.topics.forEach(v=>option($('#topic'),v.aid,'#'+v.aid+' '+v.title));$('#topic').value=aid||'';if(aid)await load();else{clear();pageStatus(data.topics.length?'请选择专题后读取节点':'当前语言还没有专题，请先在内容管理中新增专题文档')}}catch(e){clear();pageStatus(e.message,true)}}
function clear(){window.CmsUI?.clean($('#nodes-form'));loadingVersion++;$('#nodes').replaceChildren();$('#owner').textContent='';permissions={save:false,delete:false};$('#save').disabled=true;$('#add').disabled=true;$('#count').textContent=''}
async function load(){const version=++loadingVersion;pageStatus('读取中…');$('#save').disabled=true;$('#add').disabled=true;try{if(!aid)throw Error('请先选择专题');const data=await api('select?'+query());const choices=await api('choices?'+query());if(version!==loadingVersion)return;permissions=data.permissions;categories=choices.categories;$('#nodes').replaceChildren();data.nodes.forEach(addNode);$('#owner').textContent='专题 #'+aid+'：'+data.owner.title+' · 语言：'+lang;$('#save').disabled=!permissions.save;$('#add').disabled=!permissions.save;pageStatus('');window.CmsUI?.clean($('#nodes-form'));count()}catch(e){if(version===loadingVersion){clear();pageStatus(e.message,true)}}}
function field(card,label,key,value,type='text'){const l=el('label',label),n=el('input');n.type=type;n.value=value??'';n.dataset.key=key;if(type==='number'){n.min=key==='sort_order'?'-2147483648':'0';n.max='2147483647'}else n.maxLength=key==='keywords'?200:50;l.append(n);card.append(l);return n}
function selectField(card,label,key,value,values){const l=el('label',label),n=el('select');n.dataset.key=key;values.forEach(v=>option(n,v[0],v[1]));n.value=String(value??0);l.append(n);card.append(l);return n}
function count(){$('#count').textContent='共 '+$('#nodes').children.length+' 个节点'}
function addNode(node={}){const card=el('section');card.className='node';card.dataset.id=node.node_id||0;card._selections=[];const ids=String(node.aidlist||'').split(',').filter(Boolean),sorts=String(node.allsorts||'').split(',');ids.forEach((id,i)=>card._selections.push({aid:Number(id),sort:sorts[i]??i+1,title:''}));const head=el('div');head.className='actions';head.append(el('strong',node.node_id?'节点 #'+node.node_id:'新节点'),btn('上移',()=>{const prev=card.previousElementSibling;if(prev){card.parentNode.insertBefore(card,prev);renumber()}}),btn('下移',()=>{const next=card.nextElementSibling;if(next){card.parentNode.insertBefore(next,card);renumber()}}),btn('删除节点',()=>removeNode(card),'danger'));card.append(head);const grid=el('div');grid.className='grid';field(grid,'节点名称','title',node.title??('节点'+($('#nodes').children.length+1)));field(grid,'节点标识','code',node.code??('node_'+Date.now().toString(36)+'_'+$('#nodes').children.length));selectField(grid,'获取方式','isauto',node.isauto,[[0,'手动选择文档'],[1,'自动获取文档']]);const cat=selectField(grid,'自动获取栏目（含同模型子栏目）','typeid',node.typeid,[[0,'全部企业内容'],...categories.map(v=>[v.id,'#'+v.id+' '+v.typename])]);if(node.typeid&&!categories.some(v=>Number(v.id)===Number(node.typeid)))option(cat,node.typeid,'失效栏目 #'+node.typeid);cat.value=node.typeid||0;field(grid,'关键词（逗号分隔）','keywords',node.keywords||'');field(grid,'显示条数（0使用默认10条）','row',node.row??10,'number');field(grid,'节点排序','sort_order',node.sort_order??($('#nodes').children.length+1),'number');selectField(grid,'节点状态','status',node.status??1,[[1,'启用'],[0,'停用']]);selectField(grid,'节点显示','is_del',node.is_del??0,[[0,'显示'],[1,'隐藏（保留数据）']]);card.append(grid);const manual=el('div');manual.className='manual';manual.append(el('p','手选文档及排序（切换自动获取时仍保留）'));const picked=el('div');picked.className='picked-list';manual.append(picked,btn('搜索并添加文档',()=>openPicker(card)),btn('清空手选文档',()=>{card._selections=[];renderSelections(card);window.CmsUI?.dirty($('#nodes-form'))}));card.append(manual);$('#nodes').append(card);renderSelections(card);if(!permissions.save)card.querySelectorAll('input,select,button').forEach(c=>c.disabled=true);const removeButton=head.lastElementChild;removeButton.disabled=node.node_id?!permissions.delete:!permissions.save;count()}
function renumber(){window.CmsUI?.dirty($('#nodes-form'));$('#nodes').querySelectorAll('[data-key="sort_order"]').forEach((n,i)=>n.value=i+1)}
function renderSelections(card){const list=card.querySelector('.picked-list');list.replaceChildren();card._selections.forEach((doc,i)=>{const line=el('div');line.className='picked';line.append(el('span','#'+doc.aid+(doc.title?' '+doc.title:'')));const sort=el('input');sort.type='number';sort.min='-2147483648';sort.max='2147483647';sort.value=doc.sort;sort.setAttribute('aria-label','文档 #'+doc.aid+' 排序');sort.oninput=()=>{doc.sort=sort.value;window.CmsUI?.dirty($('#nodes-form'))};line.append(sort,btn('移除',()=>{card._selections.splice(i,1);renderSelections(card);window.CmsUI?.dirty($('#nodes-form'))}));if(!permissions.save)line.querySelectorAll('input,button').forEach(n=>n.disabled=true);list.append(line)})}
async function openPicker(card){activePicker=card;$('#search').value='';$('#picker').showModal();await find()}
async function find(){try{const current=activePicker,data=await api('choices?'+query({q:$('#search').value}));if(current!==activePicker)return;$('#results').replaceChildren();data.archives.forEach(doc=>{const tr=el('tr'),action=el('td'),add=btn('添加',()=>{if(!current._selections.some(x=>x.aid===Number(doc.aid))){current._selections.push({aid:Number(doc.aid),sort:current._selections.length+1,title:doc.title});renderSelections(current);window.CmsUI?.dirty($('#nodes-form'))}add.disabled=true;add.textContent='已添加'});add.disabled=current._selections.some(x=>x.aid===Number(doc.aid));action.append(add);tr.append(el('td',doc.aid),el('td',doc.title+(Number(doc.status)!==1||Number(doc.arcrank)<0?'（未发布）':'')),action);$('#results').append(tr)});$('#picker-status').textContent=data.archives.length?'':'没有匹配文档'}catch(e){$('#picker-status').textContent=e.message}}
function removeNode(card){if(!Number(card.dataset.id)){card.remove();count();window.CmsUI?.dirty($('#nodes-form'));return}pendingRemove=card;$('#remove-text').textContent='节点 #'+card.dataset.id+'「'+card.querySelector('[data-key="title"]').value+'」';$('#confirm-remove').checked=false;$('#execute-remove').disabled=true;$('#remove-status').textContent='';$('#remove-dialog').showModal()}
$('#execute-remove').onclick=async()=>{if(!$('#confirm-remove').checked||!pendingRemove)return;$('#execute-remove').disabled=true;try{const body=new FormData();body.append('aid',aid);body.append('lang',lang);body.append('ids[]',pendingRemove.dataset.id);body.append('confirm','1');await api('delete',body);pendingRemove.remove();pendingRemove=null;$('#remove-dialog').close();count();pageStatus('节点已永久删除，其他未保存修改仍保留')}catch(e){$('#remove-status').textContent=e.message;$('#execute-remove').disabled=false}};
$('#save').onclick=async()=>{if(!permissions.save||$('#save').disabled)return;$('#save').disabled=true;try{const nodes=Array.from($('#nodes').children).map(card=>{const n={node_id:Number(card.dataset.id)};card.querySelectorAll('[data-key]').forEach(input=>n[input.dataset.key]=input.value);n.aidlist=card._selections.map(v=>v.aid);n.allsorts=card._selections.map(v=>v.sort);return n});const body=new FormData();body.append('aid',aid);body.append('lang',lang);body.append('nodes',JSON.stringify(nodes));await api('save',body);window.CmsUI?.clean($('#nodes-form'));await load();pageStatus('')}catch(e){pageStatus(e.message,true)}finally{$('#save').disabled=!permissions.save}};
$('#confirm-remove').onchange=()=>$('#execute-remove').disabled=!$('#confirm-remove').checked;$('#cancel-remove').onclick=()=>$('#remove-dialog').close();$('#add').onclick=()=>{addNode();window.CmsUI?.dirty($('#nodes-form'))};async function leaveNodes(){if(document.body.hasAttribute('data-cms-submit-busy'))return false;if($('#nodes-form').dataset.cmsDirty!=='1')return true;if(!await window.CmsUI.confirm('当前专题节点尚未保存，放弃修改并继续？',{title:'未保存的专题节点',confirmText:'放弃修改',cancelText:'继续编辑'}))return false;window.CmsUI.clean($('#nodes-form'));return true}async function selectTopic(){const target=Number($('#topic').value);if(!await leaveNodes()){$('#topic').value=aid||'';return}aid=target;syncUrl();load()}$('#load').onclick=selectTopic;$('#topic').onchange=selectTopic;$('#language').onchange=async()=>{const target=$('#language').value;if(!await leaveNodes()){$('#language').value=lang;return}lang=target;aid=0;syncUrl();clear();topics()};$('#find').onclick=find;$('#search').onkeydown=e=>{if(e.key==='Enter')find()};$('#close-picker').onclick=()=>{$('#picker').close();activePicker=null};topics();
</script></body></html>
