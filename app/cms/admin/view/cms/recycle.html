<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>回收站</title><style>body{font:14px system-ui;padding:25px;background:#f3f5f8;color:#25304a}main{padding:25px;background:white;border-radius:10px}button,select{padding:8px 14px;border:1px solid #ccd4df;border-radius:4px;background:white;cursor:pointer}table{width:100%;border-collapse:collapse;margin:20px 0}th,td{padding:12px;border-bottom:1px solid #e4e8ee;text-align:left}td button{margin-right:10px}#message,#purge-error{color:#bb3030;white-space:pre-wrap}dialog{width:min(640px,85vw);max-height:85vh;overflow:auto;border:0;border-radius:10px;padding:24px}dialog::backdrop{background:#10204077}.confirm-record{white-space:pre-wrap;overflow-wrap:anywhere}.confirm-check{display:flex;align-items:center;gap:8px;margin:18px 0}.confirm-actions{display:flex;justify-content:flex-end;gap:10px}button:disabled{opacity:.5;cursor:not-allowed}</style><link rel="stylesheet" href="<?= htmlspecialchars(\app\cms\AssetManifest::url('/app/admin/admin/css/cms-content-pages.css?v=20261105-content1'), ENT_QUOTES | ENT_SUBSTITUTE, 'UTF-8') ?>"><link rel="stylesheet" href="<?= htmlspecialchars(\app\cms\AssetManifest::url('/app/admin/admin/css/cms-page-adapters.css?v=20261105-adapters1'), ENT_QUOTES | ENT_SUBSTITUTE, 'UTF-8') ?>">
</head><body class="cms-content-page cms-content-recycle cms-page-adapted"><h1>回收站</h1><main class="cms-page-panel"><header class="cms-filterbar" data-cms-filter><label>回收类型<select id="type"><option value="archives">文档</option><option value="arctype">栏目</option><option value="customvar">自定义变量</option><option value="gbookattr">表单字段</option></select></label><label id="fieldtype-label">字段类型<select id="fieldtype" hidden aria-label="字段类型"><option value="0">留言栏目字段</option><option value="1">自由表单字段</option></select></label></header><p class="hint">同名自定义变量的各语言记录一起回收、恢复或永久删除，恢复时保留各自原值。</p><p class="hint">表单字段按语言关联组回收和恢复；恢复保留原字段 ID、选项和历史值，后台列表显示重置为隐藏。独立编辑语言只操作当前字段。</p><p id="message"></p><div class="cms-table-scroll"><table><thead><tr><th>ID</th><th>名称</th><th>删除方式</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><footer><button id="prev">上一页</button><span id="info"></span><button id="next">下一页</button></footer></main><dialog id="purge-dialog" aria-labelledby="purge-title" aria-describedby="purge-record purge-warning" data-cms-dialog-kind="confirm"><h2 id="purge-title">确认彻底删除</h2><p id="purge-record" class="confirm-record"></p><p id="purge-warning">将彻底删除所选记录及其关联内容，无法从回收站恢复。</p><label class="confirm-check"><input id="purge-confirm" type="checkbox">我确认彻底删除以上记录及其关联内容</label><p id="purge-error" role="alert"></p><div class="confirm-actions"><button id="purge-cancel" type="button" autofocus>取消</button><button id="purge-execute" type="button" disabled>确认彻底删除</button></div></dialog><script>
let page=1;const $=s=>document.querySelector(s);const fieldQuery=()=>$('#type').value==='gbookattr'?'&form_type='+$('#fieldtype').value:'';async function load(){try{const result=await(await fetch('/app/admin/recycle/select?type='+$('#type').value+'&page='+page+fieldQuery())).json();if(result.code!==0)throw Error(result.msg);$('#rows').replaceChildren();result.data.forEach(row=>{const tr=document.createElement('tr'),id=row.aid??row.id??row.attr_id;[id,row.title??row.typename??row.attr_name,$('#type').value==='customvar'?'变量组 · '+row.lang:$('#type').value==='gbookattr'?'表单字段 · '+row.lang:row.del_method===2?'随栏目回收':'直接回收'].forEach(value=>{const td=document.createElement('td');td.textContent=value;tr.append(td)});const td=document.createElement('td');['restore','purge'].forEach(action=>{const button=document.createElement('button');button.textContent=action==='restore'?'恢复':'彻底删除';button.onclick=()=>change(action,id,row);td.append(button)});tr.append(td);$('#rows').append(tr)});if(!result.data.length){const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=4;td.className='cms-empty';td.textContent='当前类型没有已回收记录';tr.append(td);$('#rows').append(tr)}$('#info').textContent=`第 ${page} 页 · 共 ${result.count} 条`;$('#prev').disabled=page===1;$('#next').disabled=page*20>=result.count}catch(error){$('#message').textContent=error.message}}let pendingPurge=null,changeBusy=false;
function openPurge(target,row){
if(changeBusy||$('#purge-dialog').open)return;
pendingPurge=target;
const types={archives:'文档',arctype:'栏目',customvar:'自定义变量',gbookattr:target.form_type==='1'?'自由表单字段':'留言栏目字段'},name=['title','typename','attr_name','name','attr_var_name'].map(key=>String(row[key]??'').trim()).find(Boolean)||'未命名记录';
$('#purge-record').textContent='类型：'+types[target.type]+'\nID：'+target.id+'\n名称：'+name;
$('#purge-warning').textContent=(target.type==='customvar'?'所选 ID 可能对应同名变量的多语言关联组。':target.type==='gbookattr'?'所选 ID 可能对应按当前语言关联策略确定的字段关联组。':'')+'将彻底删除所选记录及其关联内容，无法从回收站恢复。';
$('#purge-confirm').checked=false;$('#purge-confirm').disabled=false;$('#purge-execute').disabled=true;$('#purge-cancel').disabled=false;$('#purge-error').textContent='';$('#purge-dialog').showModal();
}
async function change(action,id,row={}){
if(changeBusy)return;
const target={type:$('#type').value,id,form_type:$('#fieldtype').value};
if(action==='purge'){openPurge(target,row);return}
await submitChange(action,target);
}
const pendingWrites=new WeakMap();
async function withPendingWrite(enabled,run){if(!enabled)return run();const roots=[document.body,...document.querySelectorAll('dialog[open]')];roots.forEach(root=>{pendingWrites.set(root,(pendingWrites.get(root)||0)+1);root.setAttribute('data-cms-submit-busy','');root.setAttribute('aria-busy','true')});try{return await run()}finally{roots.forEach(root=>{const count=(pendingWrites.get(root)||1)-1;if(count)pendingWrites.set(root,count);else{pendingWrites.delete(root);root.removeAttribute('data-cms-submit-busy');root.removeAttribute('aria-busy')}})}}
async function submitChange(action,target){
if(changeBusy)return;
changeBusy=true;
if(action==='purge'){$('#purge-execute').disabled=true;$('#purge-cancel').disabled=true;$('#purge-confirm').disabled=true;$('#purge-dialog').setAttribute('aria-busy','true');$('#purge-error').textContent=''}
try{const data=new FormData();data.append('type',target.type);data.append('ids[]',target.id);if(target.type==='gbookattr')data.append('form_type',target.form_type);const result=await withPendingWrite(true,async()=>await(await fetch('/app/admin/recycle/'+action,{method:'POST',body:data})).json());if(result.code!==0)throw Error(result.msg||'操作失败');$('#message').textContent=result.msg;if(action==='purge'){pendingPurge=null;$('#purge-dialog').close()}await load()}
catch(error){if(action==='purge')$('#purge-error').textContent=error.message;else $('#message').textContent=error.message}
finally{changeBusy=false;if(action==='purge'){$('#purge-cancel').disabled=false;$('#purge-confirm').disabled=false;$('#purge-execute').disabled=!$('#purge-confirm').checked;$('#purge-dialog').removeAttribute('aria-busy')}}
}
$('#purge-cancel').onclick=()=>{if(!changeBusy)$('#purge-dialog').close()};
$('#purge-dialog').addEventListener('cancel',event=>{if(changeBusy)event.preventDefault()});
$('#purge-dialog').addEventListener('close',()=>{if(!changeBusy)pendingPurge=null});
$('#purge-confirm').onchange=()=>{$('#purge-execute').disabled=changeBusy||!$('#purge-confirm').checked};
$('#purge-execute').onclick=async()=>{if(changeBusy||!pendingPurge||!$('#purge-confirm').checked)return;await submitChange('purge',pendingPurge)};
$('#type').onchange=()=>{$('#fieldtype').hidden=$('#type').value!=='gbookattr';page=1;load()};$('#fieldtype').onchange=()=>{page=1;load()};$('#prev').onclick=()=>{page--;load()};$('#next').onclick=()=>{page++;load()};load();
</script></body></html>
