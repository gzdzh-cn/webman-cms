<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>内容管理工具</title><style>
body{margin:0;background:#f4f6f9;color:#273449;font:14px system-ui,sans-serif;padding:20px}main{background:#fff;border:1px solid #e3e8ef;border-radius:8px;padding:20px;max-width:1100px;margin:auto}h1{font-size:18px;margin:0}h2{font-size:15px;margin:20px 0 12px}.heading{display:flex;align-items:center;gap:12px;margin-bottom:18px}a{color:#2563eb;text-decoration:none}nav{display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid #e8edf3;padding-bottom:12px}button,input,textarea,select{font:inherit;box-sizing:border-box}button{background:white;border:1px solid #d8e0e9;border-radius:5px;padding:8px 14px;cursor:pointer}button.primary{background:#2563eb;color:#fff;border-color:#2563eb}button:disabled{opacity:.55;cursor:wait}nav button[aria-selected=true]{background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe}label{display:block;margin:14px 0 6px}textarea,input[type=text],input[type=number],select{width:100%;max-width:680px;border:1px solid #d8e0e9;border-radius:5px;padding:9px 10px}textarea{min-height:160px}small,.hint{color:#64748b;line-height:1.7}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:300px;overflow:auto;background:#f8fafc;padding:12px;border-radius:5px}#result{color:#b42318;white-space:pre-wrap;line-height:1.7;margin:14px 0}#result.success{color:#166534}.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}.choices{max-height:420px;overflow:auto;border:1px solid #e3e8ef;padding:0 12px;margin:12px 0}.choices label{padding:10px 0;margin:0;border-bottom:1px solid #edf1f5;display:flex;gap:8px}section[hidden]{display:none}.inline{display:flex;gap:16px;flex-wrap:wrap}.inline label{display:flex;align-items:center;gap:5px}#search-settings label{max-width:680px}#search-settings input[type=number]{max-width:220px}@media(max-width:767px){body{padding:12px}main{padding:16px}.heading{align-items:flex-start}nav button{flex:1}textarea,input,select{max-width:100%}}
</style></head><body class="cms-page-adapted cms-editor-page" data-cms-return-url="<?=htmlspecialchars($endpoint.'/index',ENT_QUOTES)?>"><main><div class="heading"><a href="<?=htmlspecialchars($endpoint.'/index',ENT_QUOTES)?>" aria-label="返回列表">←</a><h1><?= $module==='tagindex'?'TAG管理工具':($module==='search_word'?'搜索管理工具':'留言导出') ?></h1></div><nav role="tablist" aria-label="管理工具" id="tabs"></nav><div id="result" role="status" aria-live="polite" tabindex="-1"></div>
<section id="batch" hidden><h2>批量新增</h2><p class="hint">每行一项，最多500项；已有记录保留原值。先预览再执行，可重试未完成项目。</p><form id="batch-form"><label for="values">批量内容</label><textarea id="values" name="values" required></textarea><div class="actions"><button class="primary" type="submit">预览差异</button><button type="button" id="run" disabled>确认新增</button></div></form><pre id="batch-preview" hidden></pre></section>
<section id="relations" hidden><h2>关联文档</h2><p class="hint">只处理当前搜索结果中明确选择的文档，其他关联保持。只显示当前语言及有权管理的文档。</p><form id="relation-search" data-cms-filter><label for="tag-id">TAG ID</label><input id="tag-id" type="number" min="1" required><label for="document-search">文档标题</label><input id="document-search" type="text"><div class="actions"><button type="submit">读取候选</button></div></form><form id="relation-form"><p id="tag-name"></p><div id="documents" class="choices"></div><div class="actions"><button class="primary" type="submit" id="save-relations" disabled>保存本次候选关联</button></div></form></section>
<section id="search-settings" hidden><h2>搜索设置</h2><p class="hint">设置仅保存到当前编辑语言，立即供前台搜索读取，不影响其他语言的已有设置。</p><form id="settings-form"><label for="search_model">搜索模式</label><select name="search_model" id="search_model"><option value="default">普通搜索</option><option value="accurate">准确匹配</option><option value="intellect">智能多字段搜索</option></select><label for="search_second">统计时间范围（秒，0表示不限制）</label><input name="search_second" id="search_second" type="number" min="0" max="999999" required><label for="search_maxnum">时间范围内最多搜索次数</label><input name="search_maxnum" id="search_maxnum" type="number" min="0" max="999999" required><label for="search_locking">限制持续时间（秒）</label><input name="search_locking" id="search_locking" type="number" min="0" max="999999" required><label for="title_word_model">分词匹配</label><select name="title_word_model" id="title_word_model"><option value="0">包含匹配</option><option value="1">分词匹配</option></select><label>智能搜索字段</label><div class="inline"><label><input type="checkbox" name="intellect_arr[]" value="title">标题</label><label><input type="checkbox" name="intellect_arr[]" value="seo_keywords">关键词</label><label><input type="checkbox" name="intellect_arr[]" value="seo_description">描述</label><label><input type="checkbox" name="intellect_arr[]" value="content">正文</label></div><label for="search_tabu_words">搜索禁词（每行一项）</label><textarea name="search_tabu_words" id="search_tabu_words"></textarea><input type="hidden" name="fingerprint"><div class="actions"><button class="primary" type="submit">保存设置</button></div></form></section>
<section id="export" hidden><h2>导出CSV</h2><p class="hint">导出当前语言及权限范围内的记录，最多10000条。留言仅附加配置为列表显示的提交字段。</p><label for="export-q">筛选关键词</label><input id="export-q" type="text"><div class="actions"><button id="download" type="button" class="primary">下载CSV</button></div></section>
</main><script>
const config=<?=json_encode(['module'=>$module,'permissions'=>$permissions,'endpoint'=>$endpoint],JSON_HEX_TAG|JSON_HEX_AMP|JSON_HEX_APOS|JSON_HEX_QUOT)?>;
const $=s=>document.querySelector(s);let token='',busy=false,relation=null,settingsLoaded=false;
function message(text,ok=false){$('#result').textContent=text;$('#result').className=ok?'success':'';if(text)$('#result').focus();}
async function api(...args){return !!args[1]&&['saverelations','savesearchsettings'].includes(args[0])?window.CmsUI.persist(()=>rawSaveRequest(...args)):rawSaveRequest(...args);}
async function rawSaveRequest(action,body){if(body)body.set('csrf',window.CmsLanguageInitial?.csrf||'');const response=await fetch(config.endpoint+'/'+action,{method:body?'POST':'GET',headers:{Accept:'application/json'},...(body?{body}:{})});let result;try{result=await response.json();}catch(_){throw Error('服务响应无法读取，请检查登录状态后重试。');}if(!response.ok||result.code!==0)throw Error(result.msg||'操作失败');return result.data;}
async function task(form,action){if(busy)return;busy=true;window.CmsUI?.setBusy(form,true);message('正在处理，请稍候…');try{await action();}catch(error){message(error.message||'网络连接失败，输入已保留。');}finally{busy=false;window.CmsUI?.setBusy(form,false);$('#run').disabled=!config.permissions.save||!token;$('#save-relations').disabled=!config.permissions.save||!relation;}}
async function activate(id){if(busy)return;document.querySelectorAll('main>section').forEach(section=>section.hidden=section.id!==id);document.querySelectorAll('#tabs button').forEach(button=>button.setAttribute('aria-selected',String(button.dataset.target===id)));message('');if(id==='search-settings'&&!settingsLoaded){await task($('#settings-form'),async()=>{const data=await api('searchsettings');const form=$('#settings-form');for(const [key,value]of Object.entries(data)){if(key==='intellect_arr'){let fields=[];try{fields=JSON.parse(value);}catch(_){}form.querySelectorAll('[name="intellect_arr[]"]').forEach(input=>input.checked=fields.includes(input.value));}else if(form.elements.namedItem(key))form.elements.namedItem(key).value=value;}settingsLoaded=true;window.CmsUI?.clean(form);message('');});}}
$('#batch-form').oninput=()=>{token='';$('#run').disabled=true;$('#batch-preview').hidden=true;};
$('#batch-form').onsubmit=event=>{event.preventDefault();if(!config.permissions.save)return;task(event.currentTarget,async()=>{const data=await api('batchpreview',new FormData(event.target));token=data.token;$('#batch-preview').textContent='新增 '+data.create+' 项，保留已有 '+data.skip+' 项\n'+data.items.map(item=>(item.existing.length?'保留：':'新增：')+item.value).join('\n');$('#batch-preview').hidden=false;$('#run').disabled=false;message('预览完成，请核对清单。',true);});};
$('#run').onclick=()=>task($('#batch-form'),async()=>{const body=new FormData();body.set('token',token);const data=await api('batchrun',body);$('#batch-preview').textContent=data.results.map(item=>({'success':'成功','failed':'失败','skipped':'跳过'}[item.state])+': '+item.value+(item.reason?' — '+item.reason:'')).join('\n');message('成功 '+data.success+'，失败 '+data.failed+'，跳过 '+data.skipped,data.failed===0);if(!data.failed){token='';$('#run').disabled=true;window.CmsUI?.clean($('#batch-form'));}});
$('#relation-search').onsubmit=event=>{event.preventDefault();task($('#relation-form'),async()=>{const id=$('#tag-id').value,q=$('#document-search').value;const data=await api('relations?tag_id='+encodeURIComponent(id)+'&q='+encodeURIComponent(q));relation={...data,id};$('#documents').replaceChildren();$('#tag-name').textContent=data.tag.tag+(data.limited?'（最多显示200条，请缩小搜索范围）':'');for(const row of data.documents){const label=document.createElement('label'),input=document.createElement('input');input.type='checkbox';input.name='aids[]';input.value=row.aid;input.checked=data.selected.includes(Number(row.aid));label.append(input,document.createTextNode(row.title+'（ID '+row.aid+'）'));$('#documents').append(label);}$('#save-relations').disabled=!config.permissions.save;window.CmsUI?.clean($('#relation-form'));message(data.documents.length?'候选已读取。':'没有符合条件的文档。',true);});};
$('#relation-form').onsubmit=event=>{event.preventDefault();if(!relation||!config.permissions.save)return;task(event.target,async()=>{const body=new FormData(event.target);body.set('tag_id',relation.id);body.set('fingerprint',relation.fingerprint);for(const row of relation.documents)body.append('visible_ids[]',row.aid);const data=await api('saverelations',body);relation=null;$('#save-relations').disabled=true;window.CmsUI?.clean(event.target);message('已新增 '+data.added+' 个关联，移除 '+data.removed+' 个关联。',true);});};
$('#settings-form').onsubmit=event=>{event.preventDefault();if(!config.permissions.save)return;task(event.target,async()=>{const data=await api('savesearchsettings',new FormData(event.target));event.target.elements.fingerprint.value=data.fingerprint;window.CmsUI?.clean(event.target);message('搜索设置已保存。',true);});};
$('#download').onclick=()=>{const url=new URL(config.endpoint+'/export',location.origin);url.searchParams.set('q',$('#export-q').value);location.href=url.pathname+url.search;};
const tabs=config.module==='tagindex'?[['batch','批量新增'],['relations','文档关联']]:config.module==='search_word'?[['batch','批量新增'],['search-settings','搜索设置'],['export','导出CSV']]:[['export','导出CSV']];
for(const [id,title]of tabs){const button=document.createElement('button');button.type='button';button.textContent=title;button.dataset.target=id;button.setAttribute('role','tab');button.onclick=()=>activate(id);$('#tabs').append(button);}
if(!config.permissions.save){$('#batch').querySelectorAll('button,textarea').forEach(input=>input.disabled=true);$('#settings-form').querySelectorAll('input,textarea,select,button').forEach(input=>input.disabled=true);}
const requestedTag=new URL(location.href).searchParams.get('tag_id');if(config.module==='tagindex'&&/^[1-9][0-9]*$/.test(requestedTag||'')){$('#tag-id').value=requestedTag;activate('relations');}else activate(tabs[0][0]);
</script></body></html>
