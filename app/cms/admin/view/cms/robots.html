<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>robots.txt 管理 · SEO设置</title>
<link rel="stylesheet" href="<?= htmlspecialchars(\app\cms\AssetManifest::url('/admin-assets/css/cms-page-layout.css'), ENT_QUOTES | ENT_SUBSTITUTE, 'UTF-8') ?>">
<link rel="stylesheet" href="<?= htmlspecialchars(\app\cms\AssetManifest::url('/admin-assets/css/cms-module-navigation.css'), ENT_QUOTES | ENT_SUBSTITUTE, 'UTF-8') ?>">
<script src="<?= htmlspecialchars(\app\cms\AssetManifest::url('/admin-assets/js/cms-module-navigation.js'), ENT_QUOTES | ENT_SUBSTITUTE, 'UTF-8') ?>"></script>
<link rel="stylesheet" href="<?= htmlspecialchars(\app\cms\AssetManifest::url('/admin-assets/css/cms-seo.css?ui=20261111-robotstab3'), ENT_QUOTES | ENT_SUBSTITUTE, 'UTF-8') ?>">
</head><body class="cms-module-page cms-workspace-page cms-seo-page cms-robots-page">
<div data-cms-module-navigation></div>
<main class="cms-page-panel">
<header class="cms-robots-heading"><div><h1>robots.txt 管理</h1><p>设置搜索引擎的抓取规则，保存后对全站生效。</p></div><a href="/robots.txt" target="_blank" rel="noopener">查看文件 <span aria-hidden="true">↗</span></a></header>
<form id="robots-form" aria-label="爬虫访问规则">
<div class="cms-robots-layout"><section class="cms-robots-editor"><label for="content">文件内容</label><textarea id="content" name="content" spellcheck="false" aria-describedby="content-help" disabled></textarea><p id="content-help" class="cms-robots-help">支持标准 robots.txt 指令和注释，最多 256 KiB。抓取规则不会替代页面访问权限。</p></section>
<aside class="cms-robots-sidebar" aria-label="规则辅助工具"><section><h2>规则参考</h2><div data-cms-filter><label for="preset" class="cms-robots-label">选择参考规则</label><select id="preset"><option value="">保留当前内容</option><option value="allow">允许抓取全站</option><option value="deny">禁止抓取全站</option></select><button id="apply-preset" type="button">填入编辑区</button></div><p class="cms-robots-help">仅替换编辑区内容，保存后才会生效。</p></section>
<section><h2>保存记录</h2><label for="revision" class="cms-robots-label">恢复到保存前</label><select id="revision"><option value="">正在读取…</option></select><button id="restore" type="button" disabled>恢复所选版本</button><p class="cms-robots-help">仅能恢复与当前文件一致的记录，不会覆盖后续人工修改。</p></section>
<details><summary>常用指令说明</summary><dl><dt>User-agent</dt><dd>指定搜索引擎爬虫</dd><dt>Allow / Disallow</dt><dd>允许或禁止抓取指定路径</dd><dt>Sitemap</dt><dd>站点地图的完整网址</dd></dl></details></aside></div>
<p id="status" role="status" aria-live="polite">正在读取…</p><button id="retry" type="button" hidden>重试读取</button>
<footer class="cms-seo-actions cms-robots-actions"><button id="save" type="submit" class="cms-primary-action" disabled>保存规则</button><button id="reset" type="button" title="恢复最近读取或保存的规则" disabled>重置</button></footer>
</form></main>
<script>const form=document.querySelector('#robots-form'),content=document.querySelector('#content'),status=document.querySelector('#status'),save=document.querySelector('#save');let original=null,busy=false,revisions=[];function message(text,error=false){status.textContent=text;status.dataset.error=String(error)}async function api(...args){return !!args[1]&&['save','restore'].includes(args[0])?window.CmsUI.persist(()=>rawSaveRequest(...args)):rawSaveRequest(...args);}
async function rawSaveRequest(action,data){const response=await fetch('/web-admin/robots/'+action,{method:data?'POST':'GET',headers:{Accept:'application/json'},body:data,cache:'no-store'});let result;try{result=await response.json()}catch(_){throw Error('读取失败，请检查登录状态后重试')}if(!response.ok||result.code!==0)throw Error(result.msg||'操作失败');return result.data}function setBusy(value){busy=value;form.dataset.busy=value?'1':'0';window.CmsUI?.setBusy(form,value);content.disabled=value||!original?.can_save;document.querySelector('#preset').disabled=value||!original?.can_save;document.querySelector('#apply-preset').disabled=value||!original?.can_save;document.querySelector('#revision').disabled=value;save.disabled=value||!original?.can_save;document.querySelector('#reset').disabled=value||!original?.can_save;document.querySelector('#retry').disabled=value;document.querySelector('#restore').disabled=value||!original?.can_save||!revisions.find(item=>item.revision===document.querySelector('#revision').value)?.can_restore}async function load(){if(busy)return;setBusy(true);try{original=await api('select');document.querySelector('#retry').hidden=true;content.value=original.content;content.disabled=!original.can_save;save.hidden=!original.can_save;window.CmsUI?.clean(form);await loadRevisions();message(original.readonly?'公开资源已内置于二进制，robots.txt 只读，修改需重新构建。':original.exists?'已读取当前文件。':'当前尚无 robots.txt，保存后创建。')}catch(error){document.querySelector('#retry').hidden=false;message(error.message,true)}finally{setBusy(false)}}document.querySelector('#retry').onclick=load;document.querySelector('#reset').onclick=async()=>{if(busy||!original?.can_save)return;if(window.CmsUI?.isDirty(form)&&!await window.CmsUI.confirm('将放弃未保存的修改，恢复最近读取或保存的规则。',{title:'重置规则',confirmText:'确认重置',cancelText:'继续编辑'}))return;content.value=original.content;document.querySelector('#preset').value='';window.CmsUI.clean(form);message('已恢复最近读取或保存的规则。')};document.querySelector('#apply-preset').onclick=async()=>{if(!original?.can_save||busy)return;const preset=document.querySelector('#preset').value;if(!preset)return;if(!await window.CmsUI.confirm('将使用参考规则替换编辑区内容，保存后才会生效。',{title:'填入参考规则',confirmText:'填入编辑区'}))return;content.value=preset==='allow'?'User-agent: *\nAllow: /\n':'User-agent: *\nDisallow: /\n';content.dispatchEvent(new Event('input',{bubbles:true}));content.focus()};form.onsubmit=async event=>{event.preventDefault();if(busy||!original?.can_save)return;setBusy(true);message('正在保存…');try{const data=new FormData();data.append('content',content.value);data.append('hash',original.hash);data.append('exists',original.exists?'1':'0');data.append('csrf',original.csrf);const result=await api('save',data);original={...original,...result};window.CmsUI?.clean(form);await loadRevisions();message('');}catch(error){message(error.message,true);content.focus()}finally{setBusy(false)}};async function loadRevisions(){const result=await api('revisions');revisions=result.items;const select=document.querySelector('#revision');select.replaceChildren();const empty=document.createElement('option');empty.value='';empty.textContent=revisions.length?'请选择保存记录':'暂无保存记录';select.append(empty);revisions.forEach(item=>{const option=document.createElement('option');option.value=item.revision;option.textContent=new Date(item.created_at*1000).toLocaleString()+' · '+(item.can_restore?'可恢复':item.phase==='complete'?'后续已变化':'未完成，需核对');option.disabled=!item.can_restore;select.append(option)});select.onchange=()=>setBusy(busy)}document.querySelector('#restore').onclick=async()=>{if(busy||!original?.can_save)return;const revision=document.querySelector('#revision').value;if(!revisions.find(item=>item.revision===revision)?.can_restore)return;if(!await window.CmsUI.confirm('将恢复所选保存之前的内容，并替换编辑区未保存的修改。恢复过程会再次校验当前文件。',{title:'恢复爬虫规则前版本',confirmText:'确认恢复'}))return;setBusy(true);try{const data=new FormData();data.append('revision',revision);data.append('hash',original.hash);data.append('exists',original.exists?'1':'0');data.append('csrf',original.csrf);const result=await api('restore',data);original={...original,...result};content.value=result.content;window.CmsUI?.clean(form);await loadRevisions();message('已恢复前版本。')}catch(error){message(error.message,true)}finally{setBusy(false)}};load();</script></body></html>
