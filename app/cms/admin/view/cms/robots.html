<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>爬虫访问规则</title>
<style>*{box-sizing:border-box}body{margin:0;padding:20px;background:#f5f7fb;color:#27364b;font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}.card{max-width:1120px;margin:auto;padding:22px;border:1px solid #e5eaf1;border-radius:8px;background:#fff}h1{margin:0 0 6px;font-size:18px;font-weight:600}.muted{margin:0 0 18px;color:#78869a;font-size:13px}button,select{min-height:35px;padding:6px 12px;border:1px solid #dce3ec;border-radius:5px;background:#fff;color:#526177;font:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:default}.primary{color:white;background:#2563eb;border-color:#2563eb}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}textarea{display:block;width:100%;min-height:380px;padding:14px;border:1px solid #dce3ec;border-radius:5px;resize:vertical;font:13px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;tab-size:2}.actions{display:flex;gap:10px;justify-content:flex-end;align-items:center;margin-top:18px}.status{margin-right:auto;color:#61738e;white-space:pre-wrap}.status[data-error=true]{color:#b42318}details{margin-top:16px;color:#6c7c92;font-size:13px}summary{cursor:pointer}a{color:#2563eb}@media(max-width:767px){body{padding:12px}.card{padding:16px}.toolbar select{flex:1;min-width:0}.actions{flex-wrap:wrap}.status{flex-basis:100%;margin:0}textarea{min-height:360px}}</style></head><body><main class="card"><h1>爬虫访问规则</h1><p class="muted">编辑全站唯一的 <a href="/robots.txt" target="_blank" rel="noopener">/robots.txt</a>。此文件向搜索引擎提供抓取建议，不代替页面访问权限。</p>
<form id="robots-form"><div class="toolbar" data-cms-filter><label for="preset">规则参考</label><select id="preset"><option value="">保留当前内容</option value="allow">允许抓取全站</option><option value="deny">禁止抓取全站</option></select><button id="apply-preset" type="button">填入参考规则</button></div><label for="content">文件内容</label><textarea id="content" name="content" spellcheck="false" aria-describedby="content-help" disabled></textarea><p id="content-help" class="muted">支持标准 robots.txt 指令及注释，最多256 KiB。参考规则仅填入编辑区，保存后才会生效。</p><details><summary>常用指令</summary><p>User-agent 指定爬虫；Allow 允许抓取路径；Disallow 禁止抓取路径；Sitemap 填写站点地图的完整网址。多个域名共用此文件，语言内容不会随后台编辑语言切换。</p></details><div class="toolbar" data-cms-filter style="margin-top:18px"><label for="revision">保存记录</label><select id="revision" aria-label="恢复前版本"><option value="">正在读取…</option></select><button id="restore" type="button" disabled>恢复该次保存前版本</button></div><p class="muted">仅可撤销与当前文件SHA一致的保存，不覆盖后续人工修改；首次创建可恢复为文件不存在。</p><footer class="actions"><p id="status" class="status" role="status" aria-live="polite">正在读取…</p><button id="reload" type="button">重新读取</button><button id="save" type="submit" class="primary" disabled>保存</button></footer></form></main>
<script>const form=document.querySelector('#robots-form'),content=document.querySelector('#content'),status=document.querySelector('#status'),save=document.querySelector('#save');let original=null,busy=false,revisions=[];function message(text,error=false){status.textContent=text;status.dataset.error=String(error)}async function api(action,data){const response=await fetch('/app/admin/robots/'+action,{method:data?'POST':'GET',headers:{Accept:'application/json'},body:data,cache:'no-store'});let result;try{result=await response.json()}catch(_){throw Error('读取失败，请检查登录状态后重试')}if(!response.ok||result.code!==0)throw Error(result.msg||'操作失败');return result.data}function setBusy(value){busy=value;form.dataset.busy=value?'1':'0';window.CmsUI?.setBusy(form,value);content.disabled=value||!original?.can_save;document.querySelector('#preset').disabled=value||!original?.can_save;document.querySelector('#apply-preset').disabled=value||!original?.can_save;document.querySelector('#revision').disabled=value;save.disabled=value||!original?.can_save;document.querySelector('#reload').disabled=value;document.querySelector('#restore').disabled=value||!original?.can_save||!revisions.find(item=>item.revision===document.querySelector('#revision').value)?.can_restore}async function load(){if(busy)return;setBusy(true);try{original=await api('select');content.value=original.content;content.disabled=!original.can_save;save.hidden=!original.can_save;window.CmsUI?.clean(form);await loadRevisions();message(original.exists?'已读取当前文件。':'当前尚无 robots.txt，保存后创建。')}catch(error){message(error.message,true)}finally{setBusy(false)}}document.querySelector('#reload').onclick=async()=>{if(window.CmsUI?.isDirty(form)&&!await window.CmsUI.confirm('重新读取将放弃未保存的规则。',{title:'重新读取',confirmText:'放弃修改并读取'}))return;load()};document.querySelector('#apply-preset').onclick=async()=>{if(!original?.can_save||busy)return;const preset=document.querySelector('#preset').value;if(!preset)return;if(!await window.CmsUI.confirm('将使用参考规则替换编辑区内容，保存后才会生效。',{title:'填入参考规则',confirmText:'填入编辑区'}))return;content.value=preset==='allow'?'User-agent: *\nAllow: /\n':'User-agent: *\nDisallow: /\n';content.dispatchEvent(new Event('input',{bubbles:true}));content.focus()};form.onsubmit=async event=>{event.preventDefault();if(busy||!original?.can_save)return;setBusy(true);message('正在保存…');try{const data=new FormData();data.append('content',content.value);data.append('hash',original.hash);data.append('exists',original.exists?'1':'0');data.append('csrf',original.csrf);const result=await api('save',data);original={...original,...result};window.CmsUI?.clean(form);await loadRevisions();message(result.changed?'规则已保存。':'内容没有变化。')}catch(error){message(error.message,true);content.focus()}finally{setBusy(false)}};async function loadRevisions(){const result=await api('revisions');revisions=result.items;const select=document.querySelector('#revision');select.replaceChildren();const empty=document.createElement('option');empty.value='';empty.textContent=revisions.length?'请选择保存记录':'暂无保存记录';select.append(empty);revisions.forEach(item=>{const option=document.createElement('option');option.value=item.revision;option.textContent=new Date(item.created_at*1000).toLocaleString()+' · '+(item.can_restore?'可恢复':item.phase==='complete'?'后续已变化':'未完成，需核对');option.disabled=!item.can_restore;select.append(option)});select.onchange=()=>setBusy(busy)}document.querySelector('#restore').onclick=async()=>{if(busy||!original?.can_save)return;const revision=document.querySelector('#revision').value;if(!revisions.find(item=>item.revision===revision)?.can_restore)return;if(!await window.CmsUI.confirm('将恢复所选保存之前的内容，并替换编辑区未保存的修改。恢复过程会再次校验当前文件。',{title:'恢复爬虫规则前版本',confirmText:'确认恢复'}))return;setBusy(true);try{const data=new FormData();data.append('revision',revision);data.append('hash',original.hash);data.append('exists',original.exists?'1':'0');data.append('csrf',original.csrf);const result=await api('restore',data);original={...original,...result};content.value=result.content;window.CmsUI?.clean(form);await loadRevisions();message('已恢复前版本。')}catch(error){message(error.message,true)}finally{setBusy(false)}};load();</script></body></html>
