<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),base='/web-admin/filemanager/';let lang=new URLSearchParams(location.search).get('lang')||'cn',path='',theme='',permissions={},editing=null,busy=false;
let codeEditor=null,saving=false;
const currentFile=()=>editing?.create?$('filename').value:editing?.path||'';
function editorMessage(text){$('editor-message').textContent=text;}
function showEditor(content,readonly){$('content').value=content;$('content').readOnly=readonly;$('editor-reset').hidden=readonly;$('editor-message').textContent='';$('editor').showModal();try{codeEditor||=window.CmsTemplateEditor.create($('content'),{save:()=>saveSource(true),path:currentFile,message:editorMessage,change:()=>{$('code-dirty').textContent=codeEditor.value()===(editing.content||'')?'已保存':'有未保存修改';}});codeEditor.load(content,currentFile(),readonly);window.CmsUI?.clean($('source-form'));$('code-dirty').textContent=readonly?'只读':'已保存';}catch(error){editorMessage(error.message);$('content').hidden=false;}}
const pendingWrites=new WeakMap();
async function withPendingWrite(enabled,run){if(!enabled)return run();const roots=[document.body,...document.querySelectorAll('dialog[open]')];roots.forEach(root=>{pendingWrites.set(root,(pendingWrites.get(root)||0)+1);root.setAttribute('data-cms-submit-busy','');root.setAttribute('aria-busy','true')});try{return await run()}finally{roots.forEach(root=>{const count=(pendingWrites.get(root)||1)-1;if(count)pendingWrites.set(root,count);else{pendingWrites.delete(root);root.removeAttribute('data-cms-submit-busy');root.removeAttribute('aria-busy')}})}}
async function api(...args){return args[2]===true&&['newfile','edit'].includes(args[0])?window.CmsUI.persist(()=>rawSaveRequest(...args)):rawSaveRequest(...args);}
async function rawSaveRequest(action,data,post=false){return withPendingWrite(post,async()=>{const response=await fetch(base+action+(post?'':'?'+new URLSearchParams(data)),{method:post?'POST':'GET',headers:post&&!(data instanceof FormData)?{'Content-Type':'application/x-www-form-urlencoded','Accept':'application/json'}:{'Accept':'application/json'},body:post?(data instanceof FormData?data:new URLSearchParams(data)):undefined,credentials:'same-origin'});let result;try{result=await response.json();}catch{throw Error('请求失败，请检查登录状态');}if(result.code!==0)throw Error(result.msg||'操作失败');return result.data;})}
function fileSize(bytes){if(bytes<1024)return bytes+' B';if(bytes<1048576)return (bytes/1024).toFixed(1)+' KiB';return (bytes/1048576).toFixed(1)+' MiB'}
function button(label,action){const el=document.createElement('button');el.textContent=label;el.type='button';el.addEventListener('click',action);return el;}
function message(error){$('message').textContent=error?.message||error||'';}
async function listing(){if(busy)return;busy=true;message('加载中…');try{const data=await api('select',{lang,path});permissions=data.permissions;document.querySelector('.cms-template-note').textContent=data.readonly?'主题已内置于二进制，文件只读；可预览和切换，修改需重新构建。':'编辑当前语言的模板与静态文件。支持 htm、js、css、txt。图片请通过附件管理上传。';path=data.path;theme=data.theme;$('location').textContent=data.activepath;$('up').disabled=!path;$('new').hidden=!permissions.newfile;$('theme-tab').href=base+'index?'+new URLSearchParams({section:'themes',lang});$('files-tab').href=base+'index?'+new URLSearchParams({section:'files',lang});$('language').replaceChildren(...data.languages.map(item=>{const option=document.createElement('option');option.value=item.mark;option.textContent=item.title+' ('+item.mark+')';option.selected=item.mark===lang;return option;}));$('files').replaceChildren();for(const item of data.items){const tr=document.createElement('tr'),name=document.createElement('td');name.className='path';if(item.kind==='directory')name.append(button(item.name+'/',()=>{path=item.path;listing();}));else name.textContent=item.name;tr.append(name);for(const text of [item.kind==='directory'?'目录':item.kind==='source'?'源文件':item.kind==='image'?'图片':'静态文件',item.bytes===null?'—':fileSize(item.bytes),new Date(item.modified*1000).toLocaleString()]){const td=document.createElement('td');td.textContent=text;tr.append(td);}const actions=document.createElement('td');actions.className='cms-file-actions';if(item.kind==='source')actions.append(button(permissions.edit?'编辑':'查看',()=>openSource(item)));tr.append(actions);$('files').append(tr);}message(data.items.length?'':'当前目录为空');}catch(error){message(error);}finally{busy=false;}}
async function openSource(item){try{editing=await api('read',{lang,theme,path:item.path});editing.create=false;$('filename-label').hidden=true;$('editor-title').textContent='编辑模板文件 · '+item.path;$('save').hidden=!permissions.edit;showEditor(editing.content,!permissions.edit);}catch(error){message(error);}}
$('new').onclick=()=>{editing={create:true,theme,content:''};$('filename-label').hidden=false;$('filename').value='newfile.htm';$('editor-title').textContent='新建模板文件 · '+(path?path+'/':'');$('save').hidden=false;showEditor('',false);};
async function saveSource(stay=false){if(!editing||saving||$('save').hidden)return;saving=true;$('save').disabled=true;codeEditor?.readOnly(true);try{let file=editing.path;if(editing.create){const name=$('filename').value;if(!/^[A-Za-z0-9_-][A-Za-z0-9_.-]*\.(htm|js|css|txt)$/i.test(name)||name.includes('..'))throw Error('文件名仅支持字母、数字、下划线、连接符及htm/js/css/txt扩展名');file=(path?path+'/':'')+name;}const data=await api(editing.create?'newfile':'edit',{lang,theme:editing.theme||theme,path:file,hash:editing.hash||'',content:codeEditor?codeEditor.value():$('content').value},true);editing={...data,theme:editing.theme||theme,create:false};$('editor-title').textContent='编辑模板文件 · '+file;$('filename-label').hidden=true;codeEditor?.accept(data.content,file,!permissions.edit);$('save').hidden=!permissions.edit;$('editor-reset').hidden=!permissions.edit;window.CmsUI?.clean($('source-form'));$('code-dirty').textContent='已保存';editorMessage('');if(!stay)$('editor').close();await listing();message('');}catch(error){editorMessage(error.message);window.CmsUI.failure(error.message);}finally{saving=false;$('save').disabled=false;codeEditor?.readOnly(!permissions.edit&&!editing?.create);}}
$('source-form').onsubmit=event=>{event.preventDefault();saveSource(false);};
let fullscreen=false;
function setFullscreen(enabled){
 try{if(parent!==window&&parent.CmsNavigation?.setEditorFullscreen)enabled=parent.CmsNavigation.setEditorFullscreen(window,enabled);}catch(_){enabled=false;}
 fullscreen=enabled;$('editor').classList.toggle('cms-code-fullscreen',enabled);
 $('editor-fullscreen').setAttribute('aria-pressed',String(enabled));$('editor-fullscreen-label').textContent=enabled?'退出全屏':'全屏';
 $('editor-fullscreen').title=enabled?'退出全屏（Esc）':'全屏编辑，Esc 退出';
 requestAnimationFrame(()=>codeEditor?.refresh());
}
$('editor-fullscreen').onclick=()=>setFullscreen(!fullscreen);
$('editor').addEventListener('close',()=>setFullscreen(false));
window.addEventListener('pagehide',()=>setFullscreen(false));
window.addEventListener('resize',()=>codeEditor?.refresh());
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&fullscreen&&!document.querySelector('dialog[open][data-cms-ui-owned]')){event.preventDefault();event.stopImmediatePropagation();setFullscreen(false);$('editor-fullscreen').focus();}},true);
$('editor-back').onclick=()=>$('editor').close();
$('filename').addEventListener('input',()=>codeEditor?.detect());
$('editor-reset').onclick=async()=>{if(saving)return;if(window.CmsUI.isDirty($('source-form'))&&!await window.CmsUI.confirm('恢复最近读取或保存的内容？当前未保存的修改将丢弃。',{title:'重置文件内容',confirmText:'重置',cancelText:'继续编辑'}))return;if(editing.create)$('filename').value='newfile.htm';codeEditor?.load(editing.content||'',currentFile(),false);$('content').value=editing.content||'';window.CmsUI.clean($('source-form'));$('code-dirty').textContent='已保存';editorMessage('');};
$('up').onclick=()=>{path=path.split('/').slice(0,-1).join('/');listing();};$('reload').onclick=listing;$('language').onchange=()=>{lang=$('language').value;path='';listing();};listing();
})();
</script></body></html>
