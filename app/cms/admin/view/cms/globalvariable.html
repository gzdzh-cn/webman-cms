<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>自定义变量</title>

<link rel="stylesheet" href="<?= htmlspecialchars(\app\cms\AssetManifest::url('/app/admin/admin/css/cms-page-adapters.css?v=20261105-adapters1'), ENT_QUOTES | ENT_SUBSTITUTE, 'UTF-8') ?>"><link rel="stylesheet" href="<?= htmlspecialchars(\app\cms\AssetManifest::url('/app/admin/admin/css/cms-variables.css?v=20261106-basic2'), ENT_QUOTES | ENT_SUBSTITUTE, 'UTF-8') ?>"><script defer src="<?= htmlspecialchars(\app\cms\AssetManifest::url('/app/admin/admin/js/cms-variables.js?v=20261106-basic2'), ENT_QUOTES | ENT_SUBSTITUTE, 'UTF-8') ?>"></script>
</head><body class="cms-module-page cms-page-adapted cms-variable-page"><div data-cms-module-navigation></div><main class="cms-page-panel">
<form id="filters" class="cms-filterbar" data-cms-filter><label>当前语言<select id="lang" name="lang" disabled></select></label><label>变量分组<select id="type_id" name="type_id"><option value="">全部分组</option></select></label><label>变量搜索<input id="q" name="q" placeholder="名称或变量名"></label><button type="submit" id="find">查询</button><button type="button" id="reset">重置</button><span class="variable-spacer"></span><button type="button" id="manage-groups" disabled>分组管理</button><button type="button" id="create" class="primary" disabled>新增变量</button></form>
<p id="status" role="status" aria-live="polite">正在读取变量…</p><div class="variable-table"><table><thead><tr><th>变量名称</th><th>变量名</th><th>类型</th><th>变量值</th><th>分组</th><th>排序</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><footer><button type="button" id="previous">上一页</button><span id="page"></span><button type="button" id="next">下一页</button></footer></main>
<dialog id="edit-dialog" data-cms-page-when="textarea" aria-labelledby="edit-title" data-cms-dialog-kind="edit"><h2 id="edit-title">编辑变量</h2><form id="edit-form" class="variable-editor"><input type="hidden" name="attr_id"><input type="hidden" name="lang"><input type="hidden" name="inc_type"><label>变量名称<input name="attr_name" required maxlength="100"></label><label>变量名<input name="attr_var_name" placeholder="例如 web_contact_phone" maxlength="50"><small>以字母开头，仅使用字母、数字和下划线。</small></label><label>变量类型<select name="attr_input_type"><option value="0">单行文本</option><option value="1">单行文本（兼容）</option><option value="2">多行文本</option><option value="3">上传图片</option><option value="4">开关</option><option value="5">多媒体</option></select></label><label>所属分组<select name="type_id"></select></label><label>排序<input name="sort_order" type="number" min="0" max="65535"></label><label class="wide">变量值<div id="value-control"></div></label><p id="edit-error" class="wide error" role="status" aria-live="polite"></p><div class="dialog-actions wide"><button type="button" data-close="edit-dialog">取消</button><button type="submit" class="primary" id="edit-save">保存变量</button></div></form></dialog>
<dialog id="groups-dialog" aria-labelledby="groups-title" data-cms-dialog-kind="picker"><h2 id="groups-title">变量分组</h2><p class="note">先将组内变量移动到其他分组，再删除空分组。</p><div class="variable-table"><table><thead><tr><th>分组名称</th><th>排序</th><th>操作</th></tr></thead><tbody id="group-rows"></tbody></table></div><form id="group-form" class="variable-group-form"><input name="id" type="hidden"><label>分组名称<input name="type_name" required maxlength="100"></label><label>排序<input name="sort_order" type="number" min="0" max="65535" value="100"></label><button type="submit" class="primary" id="group-save">新增分组</button><button type="button" id="group-reset">取消编辑</button></form><p id="group-error" class="error" role="status" aria-live="polite"></p><div class="dialog-actions"><button type="button" data-close="groups-dialog">关闭</button></div></dialog>
<dialog id="delete-dialog" aria-labelledby="delete-title" data-cms-dialog-kind="confirm"><h2 id="delete-title">确认操作</h2><p id="delete-description"></p><p id="delete-error" class="error" role="alert"></p><div class="dialog-actions"><button type="button" data-close="delete-dialog" autofocus>取消</button><button type="button" id="delete-execute" class="danger">确认</button></div></dialog>
</body></html>
