</head><body class="cms-module-page cms-page-adapted"><div data-cms-module-navigation></div><main class="cms-page-panel"><h1>短信配置</h1><p>用于企业留言手机验证与留言通知。请在短信模板中配置签名和服务商审核通过的模板 ID。</p><form id="settings" class="cms-settings-form"><label>网站语言<select name="lang" id="lang"><?php foreach ($languages as $language): ?><option value="<?= htmlspecialchars($language['mark'], ENT_QUOTES) ?>"><?= htmlspecialchars($language['title']) ?></option><?php endforeach ?></select></label><label>短信平台<select name="sms_type"><option value="1">阿里云</option><option value="2">腾讯云（原版接口）</option></select></label><label>阿里云 AccessKey ID<input name="sms_appkey" autocomplete="off"></label><label>阿里云 AccessKey Secret<input name="sms_secretkey" type="password" autocomplete="new-password"><small data-secret="sms_secretkey"></small></label><label>腾讯云 SDK AppID<input name="sms_appid_tx" autocomplete="off"></label><label>腾讯云 AppKey<input name="sms_appkey_tx" type="password" autocomplete="new-password"><small data-secret="sms_appkey_tx"></small></label><label>国家区号<input name="sms_nation_code" value="86"></label><label>留言通知接收手机号<input name="sms_test_mobile"><small>最多5个，多个手机号用英文逗号分隔。</small></label><button type="submit" class="cms-primary-action">保存配置</button></form><p id="status" role="status" aria-live="polite"></p></main><script>const form=document.querySelector('#settings'),status=document.querySelector('#status');const initialLang=new URLSearchParams(location.search).get('lang');if(initialLang&&Array.from(form.elements['lang'].options).some(option=>option.value===initialLang))form.elements['lang'].value=initialLang;async function load(){try{const r=await fetch('/web-admin/smsconfig/select?'+new URLSearchParams({lang:form.elements['lang'].value})),j=await r.json();if(j.code!==0)throw Error(j.msg);Object.entries(j.data).forEach(([k,v])=>{if(form.elements[k])form.elements[k].value=v});document.querySelectorAll('[data-secret]').forEach(n=>n.textContent=j.data[n.dataset.secret+'_configured']?'已配置；留空保留现有密钥。':'尚未配置。');window.CmsModuleNavigation.remember({lang:form.elements['lang'].value});window.CmsModuleNavigation.markClean(form);status.textContent=''}catch(e){status.textContent=e.message}}form.elements['lang'].onchange=load;let saving=false;form.onsubmit=async e=>{e.preventDefault();if(saving)return;const body=new FormData(form);saving=true;window.CmsUI?.setBusy(form,true);status.textContent='正在保存短信配置…';try{const r=await fetch('/web-admin/smsconfig/save',{method:'POST',body}),j=await r.json();if(j.code!==0)throw Error(j.msg);window.CmsUI?.clean(form);await load();status.textContent='';window.CmsUI.success(j.msg||'短信配置已保存')}catch(e){status.textContent=e.message;window.CmsUI?.error(form,e.message)}finally{saving=false;window.CmsUI?.setBusy(form,false)}};load();</script></body></html>
