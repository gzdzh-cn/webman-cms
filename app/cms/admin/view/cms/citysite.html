<body class="cms-city-management" data-view="list">
<main id="management">
<header class="page-head"><div><h1>城市分站</h1><p class="muted">维护地区层级与分站访问设置</p></div></header>
<section class="card">
<nav class="tabs" role="tablist" aria-label="城市分站管理"><button id="tab-regions" type="button" role="tab" aria-controls="regions-panel" aria-selected="true">地区列表</button><button id="tab-settings" type="button" role="tab" aria-controls="settings-panel" aria-selected="false">分站设置</button></nav>
<p id="status" class="status" role="status" aria-live="polite"></p>
<section id="regions-panel" role="tabpanel" aria-labelledby="tab-regions">
<div class="toolbar" data-cms-filter><label for="search">地区名称<input id="search" type="search" placeholder="搜索名称或访问标识"></label><button id="find" type="button">查询</button><button id="reset" type="button">重置</button><button id="create" class="primary" type="button" hidden>新增地区</button></div>
<div class="tree-controls"><span id="count" class="muted">正在读取地区…</span><button id="expand" class="text-button" type="button">全部展开</button><button id="collapse" class="text-button" type="button">全部收起</button></div>
<div class="table-region" role="region" aria-label="地区列表，可横向滚动" tabindex="0"><table><thead><tr><th>地区名称</th><th>访问标识</th><th>访问方式</th><th>状态</th><th>排序</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div>
<details class="help"><summary>层级与状态说明</summary><p>地区最多三级。停用上级会同时停用其下级，启用下级会同时启用上级。删除将包含全部下级；已被文档使用的地区不能删除。</p></details>
</section>
<section id="settings-panel" role="tabpanel" aria-labelledby="tab-settings" hidden>
<p class="muted">多语言与城市分站不能同时开启，已有地区和内容会保留。</p>
<p id="module-warning" class="status" role="status" aria-live="polite"></p>
<details id="migration-section" class="help" hidden><summary>旧 cn 城市配置迁移检查</summary><p>城市配置统一属于系统主语言。先查看差异，仅补齐主语言缺失项；不同值、重复项及已删除项不会自动覆盖。</p><button id="migration-preview" type="button">查看差异</button><div id="migration-result" class="table-region" hidden><table><thead><tr><th>配置项</th><th>旧 cn 值</th><th>主语言值</th><th>处理结果</th></tr></thead><tbody id="migration-rows"></tbody></table></div><p id="migration-status" class="status" role="status" aria-live="polite"></p><button id="migration-apply" type="button" hidden>补齐缺失配置</button></details>
<p id="settings-readonly" class="read-only" hidden>当前账号可查看分站设置，无修改权限。</p>
<form id="settings" class="settings-form">
<div class="settings-grid">
<label class="field"><span>城市分站</span><select name="web_citysite_open"><option value="0">关闭</option><option value="1">开启</option></select></label>
<label class="field"><span>默认首页</span><select name="site_default_home" id="default-city"><option value="0">主站首页</option></select></label>
<label class="field"><span>分站模板</span><select name="site_template"><option value="0">共用主站模板</option><option value="1">使用城市独立模板</option></select><small class="hint">独立模板读取当前主题下的 city/访问标识 或 city/default 目录。</small></label>
<label class="field"><span>地区 SEO</span><select name="site_seoset"><option value="0">沿用主站</option><option value="1">自定义默认值</option></select></label>
</div>
<div id="settings-seo" class="settings-section" hidden><h2>地区 SEO 默认值</h2><div class="settings-grid"><label class="field wide"><span>SEO 标题</span><input name="site_seo_title" maxlength="200"></label><label class="field wide"><span>SEO 关键词</span><input name="site_seo_keywords" maxlength="200"></label><label class="field wide"><span>SEO 描述</span><textarea name="site_seo_description"></textarea></label></div></div>
<footer class="form-actions"><p id="settings-status" class="status" role="status" aria-live="polite"></p><button id="save-settings" type="submit" class="primary" hidden>保存设置</button></footer>
</form>
</section>
</section>
</main>
<main id="edit-page" hidden>
<header class="editor-header"><button id="back-top" class="back" type="button"><span class="icon" aria-hidden="true">←</span>返回列表</button><div><h1 id="editor-title">地区设置</h1><p class="muted">保存后返回地区列表</p></div></header>
<form id="editor" class="editor-form"><p id="editor-loading" class="status" role="status">正在读取地区…</p><div id="editor-fields"></div><footer class="editor-actions"><button id="editor-cancel" type="button">取消</button><button id="editor-save" type="submit" class="primary" hidden>保存</button></footer></form>
</main>
<script>
(function(){'use strict';

const editing=['create','edit'].includes(params.get('view')),language=params.get('lang')||'',storageKey='cms-city-list-v2:'+language;
let records=[],settingsOriginal={},editorOriginal={},collapsed=new Set(),activeTab=params.get('section')==='settings'?'settings':'regions',deleteBusy=false,migrationPlan=null;

function message(text,error=false,target=$('#status')){target.textContent=text||'';target.dataset.error=String(error)}

function listUrl(section='regions'){const u=new URL('/web-admin/citysite/index',location.origin);if(language)u.searchParams.set('lang',language);if(section==='settings')u.searchParams.set('section',section);return u.pathname+u.search}
function navigate(href){if(window.CmsUI&&!window.CmsUI.guard(()=>location.assign(href)))return;location.assign(href)}
function returnToList(){if(window.CmsUI)window.CmsUI.back(listUrl());else location.assign(listUrl())}
function setSelectValue(control,value){value=String(value??'');if(!Array.from(control.options).some(o=>o.value===value))control.append(new Option('原值：'+(value||'空'),value));control.value=value}
async function api(...args){return !!args[1]&&['save','saveSettings'].includes(args[0])?window.CmsUI.persist(()=>rawSaveRequest(...args)):rawSaveRequest(...args);}
async function rawSaveRequest(action,data){const response=await fetch('/web-admin/citysite/'+action,{method:data?'POST':'GET',body:data,headers:{Accept:'application/json'}});let result;try{result=await response.json()}catch(_){throw Error('页面会话已失效或响应异常，请刷新后重试')}if(!response.ok||result.code!==0)throw Error(result.msg||'操作失败，请重试');return result}
function setTab(tab){if(tab==='settings'&&!allowed('settings'))return;activeTab=tab;$('#regions-panel').hidden=tab!=='regions';$('#settings-panel').hidden=tab!=='settings';for(const name of ['regions','settings']){$('#tab-'+name).setAttribute('aria-selected',String(tab===name));$('#tab-'+name).tabIndex=tab===name?0:-1}const u=new URL(location.href);if(tab==='settings')u.searchParams.set('section','settings');else u.searchParams.delete('section');history.replaceState(history.state,'',u.pathname+u.search)}
function visibleRows(){const query=$('#search').value.trim().toLowerCase(),map=new Map(records.map(row=>[Number(row.id),row]));if(query){const included=new Set();for(const row of records){if(!(row.name+' '+row.domain).toLowerCase().includes(query))continue;let id=Number(row.id),seen=new Set();while(id&&!seen.has(id)){seen.add(id);included.add(id);id=Number(map.get(id)?.parent_id||0)}}return records.filter(row=>included.has(Number(row.id)))}return records.filter(row=>{let parent=Number(row.parent_id),seen=new Set();while(parent&&!seen.has(parent)){if(collapsed.has(parent))return false;seen.add(parent);parent=Number(map.get(parent)?.parent_id||0)}return true})}

function openEditor(record={}){if(!allowed('save'))return;remember();const u=new URL(listUrl(),location.origin);u.searchParams.set('view',record.id?'edit':'create');if(record.id)u.searchParams.set('record',record.id);else if(record.parent_id)u.searchParams.set('parent_id',record.parent_id);u.searchParams.set('return',listUrl());navigate(u.pathname+u.search)}

function renderEditor(record){editorOriginal={...record};$('#editor-title').textContent=record.id?'编辑地区':'新增地区';$('#editor-loading').remove();const content=$('#editor-fields');content.replaceChildren();const hidden=el('input');hidden.type='hidden';hidden.name='id';hidden.value=record.id||'';content.append(hidden);const excluded=new Set(record.id?[Number(record.id)]:[]);let changed=true;while(changed){changed=false;records.forEach(row=>{if(excluded.has(Number(row.parent_id))&&!excluded.has(Number(row.id))){excluded.add(Number(row.id));changed=true}})}const parents=[['0','顶级地区'],...records.filter(row=>Number(row.level)<3&&!excluded.has(Number(row.id))).map(row=>[String(row.id),'　'.repeat(Math.min(Number(row.depth)||0,2))+row.name])];const base=el('section',undefined,'card editor-section'),grid=el('div',undefined,'fields');base.append(el('h2','基本信息'),grid);for(const [name,title,type,choices,hint]of [['name','地区名称','text'],['domain','访问标识','text',[],'例如 beijing，用于分站地址；保存后应谨慎修改。'],['parent_id','上级地区','select',parents],['sort_order','排序','number'],['status','前台状态','select',[[1,'启用'],[0,'停用']]],['initial','首字母','text',[],'自动生成，可留空；自定义时填写1至5位字母或数字。']])grid.append(field(name,title,type,record[name]??({parent_id:0,status:1,sort_order:100}[name]??''),choices,hint));content.append(base);

const seo=el('section',undefined,'card editor-section'),seoGrid=el('div',undefined,'fields'),selector=field('seoset','地区 SEO','select',record.seoset??0,[[0,'沿用全局设置'],[1,'单独设置']]);seo.append(el('h2','SEO 设置'),selector,seoGrid);for(const[name,title,type]of [['seo_title','SEO 标题','text'],['seo_keywords','SEO 关键词','text'],['seo_description','SEO 描述','textarea']]){const label=field(name,title,type,record[name]??'');label.classList.add('wide');seoGrid.append(label)}seoGrid.append(el('p','支持 {region} 或 {区域} 作为地区名称占位符。','hint wide'));const updateSeo=()=>seoGrid.hidden=selector.querySelector('select').value!=='1';selector.querySelector('select').addEventListener('change',updateSeo);updateSeo();content.append(seo);window.CmsUI?.clean(editor);$('#editor-save').hidden=!allowed('save');$('#city-name').focus()}

function fillSettings(configuration){settingsOriginal={...configuration};const policy=configuration._policy||{};message(policy.conflict?'检测到多语言和城市分站同时开启。未修改已保存选择，请显式关闭其中一项后继续。':policy.multilingual_enabled?'当前多语言已开启；如需使用城市分站，请先在功能地图关闭多语言。':'城市设置所属系统主语言：'+(policy.main_language||'未知'),policy.conflict,$('#module-warning'));$('#migration-section').hidden=policy.main_language==='cn';const select=$('#default-city');select.replaceChildren(new Option('主站首页','0'));records.filter(row=>Number(row.status)===1).forEach(row=>select.append(new Option('　'.repeat(Math.min(Number(row.depth)||0,2))+row.name,row.id)));Object.entries(configuration).forEach(([name,value])=>{const control=settings.elements.namedItem(name);if(!control)return;if(control.tagName==='SELECT')setSelectValue(control,value);else control.value=value??''});settings.querySelectorAll('input,select,textarea').forEach(control=>control.disabled=!allowed('saveSettings'));$('#save-settings').hidden=!allowed('saveSettings');$('#settings-readonly').hidden=allowed('saveSettings');updateSettingsSeo();window.CmsUI?.clean(settings)}
function updateSettingsSeo(){$('#settings-seo').hidden=settings.elements.namedItem('site_seoset').value!=='1'}
async function load(){try{if(!allowed('select'))throw Error('当前账号没有读取地区列表的权限');const cities=await api('select');records=Array.isArray(cities.data)?cities.data:[];if(editing){if(!allowed('save'))throw Error('当前账号没有编辑地区的权限');const id=params.get('record');if(params.get('view')==='edit'&&(!/^\d+$/.test(id||'')||!records.some(row=>String(row.id)===id)))throw Error('地区不存在或已移除，请返回列表刷新');renderEditor(params.get('view')==='edit'?records.find(row=>String(row.id)===id):{parent_id:params.get('parent_id')||0});return}const saved=readState();$('#search').value=saved.q||'';collapsed=new Set(Array.isArray(saved.collapsed)?saved.collapsed.map(Number):records.filter(row=>Number(row.parent_id)===0).map(row=>Number(row.id)));renderRows();if(allowed('settings')){const result=await api('settings');fillSettings(result.data)}$('#create').hidden=!allowed('save');$('#tab-settings').hidden=!allowed('settings');setTab(activeTab==='settings'&&allowed('settings')?'settings':'regions');let flash;try{flash=sessionStorage.getItem('cms-city-saved-v2');sessionStorage.removeItem('cms-city-saved-v2')}catch(_){}message(flash||'')}catch(error){message(error.message,true,editing?$('#editor-loading'):$('#status'));if(editing){$('#editor-save').hidden=true;$('#editor-loading').tabIndex=-1;$('#editor-loading').focus()}}}
async function removeCity(row){if(!allowed('delete')||deleteBusy)return;deleteBusy=true;renderRows();try{const ids=new Set([Number(row.id)]);let count=-1;while(count!==ids.size){count=ids.size;records.forEach(item=>{if(ids.has(Number(item.parent_id)))ids.add(Number(item.id))})}const description='将永久删除“'+row.name+'”'+(ids.size>1?'及 '+(ids.size-1)+' 个下级地区':'')+'。此操作无法从回收站恢复，已被文档使用的地区不能删除。';if(!await window.CmsUI.confirm(description,{title:'删除地区',confirmText:'确认删除',danger:true}))return;$('#management').setAttribute('data-cms-submit-busy','1');const data=new FormData();data.append('ids[]',row.id);await api('delete',data);records=(await api('select')).data;if(allowed('settings')&&!window.CmsUI?.isDirty(settings))fillSettings((await api('settings')).data);message('地区已删除')}catch(error){message(error.message,true)}finally{$('#management').removeAttribute('data-cms-submit-busy');deleteBusy=false,migrationPlan=null;renderRows()}}
editor.onsubmit=async event=>{event.preventDefault();if(!allowed('save')||editor.dataset.busy==='1')return;editor.dataset.busy='1';window.CmsUI?.setBusy(editor,true);try{await api('save',formData(editor,editorOriginal));window.CmsUI?.clean(editor);try{sessionStorage.setItem('cms-city-saved-v2','地区已保存')}catch(_){}window.CmsUI?.setBusy(editor,false);if(window.CmsUI)window.CmsUI.saved(listUrl());else location.assign(listUrl())}catch(error){const fieldName=/地区名称/.test(error.message)?'name':/英文站点标识/.test(error.message)?'domain':/首字母/.test(error.message)?'initial':/排序/.test(error.message)?'sort_order':/上级|下级|三级|自身/.test(error.message)?'parent_id':null;window.CmsUI?.error(editor,error.message,fieldName?{[fieldName]:error.message}:{})}finally{delete editor.dataset.busy;window.CmsUI?.setBusy(editor,false)}};
settings.onsubmit=async event=>{event.preventDefault();if(!allowed('saveSettings')||settings.dataset.busy==='1')return;settings.dataset.busy='1';const data=formData(settings,settingsOriginal);window.CmsUI?.setBusy(settings,true);message('',false,$('#settings-status'));try{await api('saveSettings',data);fillSettings((await api('settings')).data);window.CmsUI?.clean(settings);message('分站设置已保存',false,$('#settings-status'))}catch(error){message(error.message,true,$('#settings-status'));window.CmsUI?.error(settings,error.message)}finally{delete settings.dataset.busy;window.CmsUI?.setBusy(settings,false)}};

$('#migration-preview').onclick=async()=>{const button=$('#migration-preview');button.disabled=true;try{const result=await api('migrationPreview');migrationPlan=result.data;$('#migration-rows').replaceChildren();for(const row of migrationPlan.entries){const tr=el('tr');tr.append(el('td',row.name),el('td',row.source_value===null?'未设置':String(row.source_value)),el('td',row.target_value===null?'未设置':String(row.target_value)),el('td',row.reason));$('#migration-rows').append(tr)}$('#migration-result').hidden=false;$('#migration-apply').hidden=!migrationPlan.can_apply||!allowed('saveSettings');message(migrationPlan.conflicts.length?'存在冲突，未迁移任何配置。请先核对主语言值与旧 cn 值。':'可补齐 '+migrationPlan.copy_count+' 项；旧配置原记录保留。',migrationPlan.conflicts.length>0,$('#migration-status'))}catch(error){message(error.message,true,$('#migration-status'))}finally{button.disabled=false}};
$('#migration-apply').onclick=async()=>{if(!migrationPlan?.can_apply)return;if(window.CmsUI?.isDirty(settings)){message('请先保存或放弃当前设置修改，再迁移旧配置。',true,$('#migration-status'));return}if(!await window.CmsUI.confirm('将为系统主语言 '+migrationPlan.main_language+' 补齐 '+migrationPlan.copy_count+' 项城市配置。旧 cn 记录保留，不覆盖已有值。',{title:'迁移城市配置',confirmText:'确认补齐'}))return;const button=$('#migration-apply');button.disabled=true;$('#migration-section').setAttribute('data-cms-submit-busy','1');try{const data=new FormData();data.append('fingerprint',migrationPlan.fingerprint);data.append('csrf',settingsOriginal._csrf||'');const result=await api('migrateSettings',data);fillSettings((await api('settings')).data);migrationPlan=null;button.hidden=true;message('已补齐 '+result.data.copied+' 项城市配置。',false,$('#migration-status'))}catch(error){message(error.message,true,$('#migration-status'))}finally{button.disabled=false;$('#migration-section').removeAttribute('data-cms-submit-busy')}};
$('#create').onclick=()=>openEditor();$('#find').onclick=()=>{remember();renderRows()};$('#reset').onclick=()=>{$('#search').value='';remember();renderRows()};$('#search').onkeydown=event=>{if(event.key==='Enter'){event.preventDefault();remember();renderRows()}};$('#expand').onclick=()=>{collapsed.clear();remember();renderRows()};$('#collapse').onclick=()=>{collapsed=new Set(records.map(row=>Number(row.id)));remember();renderRows()};$('#tab-regions').onclick=()=>setTab('regions');$('#tab-settings').onclick=()=>setTab('settings');document.querySelector('.tabs').addEventListener('keydown',event=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;event.preventDefault();const target=event.key==='Home'?'regions':event.key==='End'?'settings':activeTab==='regions'?'settings':'regions';if(target==='settings'&&!allowed('settings'))return;setTab(target);$('#tab-'+target).focus()});settings.elements.namedItem('site_seoset').onchange=updateSettingsSeo;$('#back-top').onclick=$('#editor-cancel').onclick=returnToList;document.body.dataset.view=editing?'editor':'list';$('#edit-page').hidden=!editing;$('#management').hidden=editing;load();
})();
</script>
</body>
</html>
