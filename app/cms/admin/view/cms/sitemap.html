<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>网站地图</title>
<link rel="stylesheet" href="<?= htmlspecialchars(\app\cms\AssetManifest::url('/app/admin/admin/css/cms-module-navigation.css?v=20261106-basic2'), ENT_QUOTES | ENT_SUBSTITUTE, 'UTF-8') ?>"><script src="<?= htmlspecialchars(\app\cms\AssetManifest::url('/app/admin/admin/js/cms-module-navigation.js?v=20261106-basic2'), ENT_QUOTES | ENT_SUBSTITUTE, 'UTF-8') ?>"></script>
<link rel="stylesheet" href="<?= htmlspecialchars(\app\cms\AssetManifest::url('/app/admin/admin/css/cms-page-adapters.css?v=20261105-adapters1'), ENT_QUOTES | ENT_SUBSTITUTE, 'UTF-8') ?>"><link rel="stylesheet" href="<?= htmlspecialchars(\app\cms\AssetManifest::url('/app/admin/admin/css/cms-generation.css?v=20261106-compact2'), ENT_QUOTES | ENT_SUBSTITUTE, 'UTF-8') ?>">
<link rel="stylesheet" href="<?= htmlspecialchars(\app\cms\AssetManifest::url('/app/admin/admin/css/cms-sitemap.css?v=20261106-rows1'), ENT_QUOTES | ENT_SUBSTITUTE, 'UTF-8') ?>">
</head><body class="cms-module-page cms-page-adapted cms-generation-page cms-sitemap-page"><div data-cms-module-navigation></div><main class="cms-page-panel">
<header><label>当前语言 <select id="lang" aria-label="当前语言"></select></label><button type="button" id="reload">刷新</button></header>
<p class="note">XML、TXT和HTML使用当前SEO规则及原栏目、文档ID生成链接。默认语言使用 sitemap.xml，其他语言使用 sitemap_语言.xml；XML过大时生成索引及分片。</p><p id="status" role="status" aria-live="polite">加载中…</p>
<form id="settings">
<div class="cms-sitemap-row"><span id="map-formats-label" class="cms-sitemap-label">地图类型</span><div class="cms-sitemap-control cms-sitemap-formats"><div class="checks" role="group" aria-labelledby="map-formats-label"><label><input name="sitemap_xml" type="checkbox" value="1">XML</label><label><input name="sitemap_txt" type="checkbox" value="1">TXT</label><label><input name="sitemap_html" type="checkbox" value="1">HTML</label></div><nav id="urls" aria-label="访问地图"></nav></div></div>
<div class="cms-sitemap-row"><span id="map-languages-label" class="cms-sitemap-label">生成语言</span><div class="cms-sitemap-control"><div class="checks" id="languages" role="group" aria-labelledby="map-languages-label"></div><p class="note">地图设置同步到所有语言。</p></div></div>
<div class="cms-sitemap-row"><label for="sitemap-auto" class="cms-sitemap-label">自动更新</label><div class="cms-sitemap-control"><label><input id="sitemap-auto" name="sitemap_auto" type="checkbox" value="1">开启</label><p class="note">内容变更后更新受控地图；访问时也可获得当前内容。</p></div></div>
<div class="cms-sitemap-row"><span id="map-filters-label" class="cms-sitemap-label">内容过滤</span><div class="cms-sitemap-control"><div class="checks" role="group" aria-labelledby="map-filters-label"><label><input name="sitemap_not1" type="checkbox" value="1">过滤隐藏栏目</label><label><input name="sitemap_not2" type="checkbox" value="1">过滤外链栏目及跳转文档</label></div><p class="note">仅收录有效公开的企业栏目和文档。</p></div></div>
<div class="cms-sitemap-row"><label for="sitemap-archives-num" class="cms-sitemap-label">文档数量</label><div class="cms-sitemap-control cms-sitemap-inline"><input id="sitemap-archives-num" name="sitemap_archives_num" type="number" min="0" max="1000000" value="1000"><span class="note">0 不含文档</span></div></div>
<div class="cms-sitemap-row"><label for="sitemap-tags-num" class="cms-sitemap-label">标签数量</label><div class="cms-sitemap-control cms-sitemap-inline"><input id="sitemap-tags-num" name="sitemap_tags_num" type="number" min="0" max="1000000" value="1000"><span class="note">0 不含标签</span></div></div>
<section class="cms-sitemap-properties" aria-label="搜索引擎属性"><h2>搜索引擎属性</h2><div id="properties"></div></section>
<div class="cms-sitemap-row"><span id="map-ai-label" class="cms-sitemap-label">AI 内容索引</span><div class="cms-sitemap-control"><label><input name="ai_content_index_html" type="checkbox" value="1" aria-labelledby="map-ai-label">AI网站内容索引页</label><p id="ai-access" class="note"></p></div></div>
<div class="actions cms-sitemap-actions"><button id="save" class="primary" type="submit" disabled>保存设置</button><button id="generate" type="button" disabled>按已保存设置生成地图</button><button id="clean" type="button" disabled>清理当前语言生成地图</button></div></form>
<div id="automatic" class="note" aria-live="polite"></div><h2 class="cms-sitemap-files-heading">已生成文件</h2><div class="table-wrap cms-sitemap-files"><table><thead><tr><th>地址</th><th>语言 / 格式</th><th>链接数</th><th>生成时间</th></tr></thead><tbody id="files"></tbody></table></div>
</main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),form=$('settings'),flags=['sitemap_xml','sitemap_txt','sitemap_html','ai_content_index_html','sitemap_auto','sitemap_not1','sitemap_not2'];let state=null,lang=new URLSearchParams(location.search).get('lang')||'',busy=false;
const text=(tag,value)=>{const node=document.createElement(tag);node.textContent=value;return node;};
for(const [type,title]of[['index','首页'],['list','栏目'],['view','文档']]){const group=document.createElement('div'),caption=text('span',title+'属性'),fields=document.createElement('div'),label=text('label','更新频率'),select=document.createElement('select');group.className='cms-sitemap-row cms-sitemap-property-row';caption.className='cms-sitemap-label';fields.className='cms-sitemap-control cms-sitemap-property-controls';select.name='sitemap_changefreq_'+type;select.id=select.name;select.setAttribute('aria-label',title+'更新频率');label.htmlFor=select.id;for(const freq of['always','hourly','daily','weekly','monthly','yearly','never']){const option=text('option',({always:'每次访问',hourly:'每小时',daily:'每天',weekly:'每周',monthly:'每月',yearly:'每年',never:'不更新'})[freq]);option.value=freq;select.append(option);}label.append(select);const priority=text('label','优先级'),input=document.createElement('input');input.name='sitemap_priority_'+type;input.id=input.name;input.setAttribute('aria-label',title+'优先级');priority.htmlFor=input.id;input.type='number';input.min='0';input.max='1';input.step='0.1';priority.append(input);fields.append(label,priority);group.append(caption,fields);$('properties').append(group);}
function message(value,error=false){$('status').textContent=value;$('status').dataset.error=error?'1':'0';}
function controls(){for(const el of form.elements)el.disabled=busy||!state||!state.permissions.save;$('save').disabled=busy||!state?.permissions.save;$('generate').disabled=busy||!state?.permissions.generate;$('clean').disabled=busy||!state?.permissions.clean;$('reload').disabled=busy;$('lang').disabled=busy;if(state&&!state.ai_available)form.elements.ai_content_index_html.disabled=true;}
const pendingWrites=new WeakMap();
async function withPendingWrite(enabled,run){if(!enabled)return run();const roots=[document.body,...document.querySelectorAll('dialog[open]')];roots.forEach(root=>{pendingWrites.set(root,(pendingWrites.get(root)||0)+1);root.setAttribute('data-cms-submit-busy','');root.setAttribute('aria-busy','true')});try{return await run()}finally{roots.forEach(root=>{const count=(pendingWrites.get(root)||1)-1;if(count)pendingWrites.set(root,count);else{pendingWrites.delete(root);root.removeAttribute('data-cms-submit-busy');root.removeAttribute('aria-busy')}})}}
async function api(action,data={},post=false){return withPendingWrite(post,async()=>{const response=await fetch('/app/admin/sitemap/'+action+(post?'':'?'+new URLSearchParams(data)),{method:post?'POST':'GET',headers:{Accept:'application/json'},credentials:'same-origin',body:post?data:undefined});let result;try{result=await response.json();}catch{throw Error('请求失败，请检查登录状态');}if(result.code!==0)throw Error(result.msg||'操作失败');return result.data;})}
async function load(){if(busy)return;if(form.dataset.cmsDirty==='1'){if(!await window.CmsUI.confirm('地图配置尚未保存，放弃修改并重新读取？',{title:'未保存的修改',confirmText:'放弃修改',cancelText:'继续编辑'})){if(state){lang=state.lang;$('lang').value=lang;}return;}window.CmsUI.clean(form);}busy=true;controls();try{state=await api('select',lang?{lang}:{});lang=state.lang;$('lang').replaceChildren(...state.languages.map(item=>{const option=text('option',item.title+' ('+item.mark+')');option.value=item.mark;option.selected=item.mark===lang;return option;}));for(const [name,value]of Object.entries(state.settings)){const el=form.elements[name];if(el){if(el.type==='checkbox')el.checked=String(value)==='1';else el.value=value;}}$('languages').replaceChildren(...state.languages.map(item=>{const label=document.createElement('label'),input=document.createElement('input');input.type='checkbox';input.name='sitemap_lang[]';input.value=item.mark;input.checked=state.settings.sitemap_lang.includes(item.mark);label.append(input,document.createTextNode(item.title));return label;}));$('urls').replaceChildren(...Object.entries(state.urls).map(([format,url])=>{const a=text('a','访问 '+format.toUpperCase());a.href=url;a.target='_blank';a.rel='noopener';return a;}));$('files').replaceChildren(...state.files.map(file=>{const tr=document.createElement('tr'),td=document.createElement('td'),a=text('a',file.url);a.href=file.url;a.target='_blank';a.rel='noopener';td.append(a);tr.append(td,text('td',file.lang+' / '+file.format),text('td',file.links),text('td',new Date(file.generated_at*1000).toLocaleString()));return tr;}));$('ai-access').textContent=state.ai_available?'使用系统内置的 AI 内容索引模板':'原服务档位 php_servicemeal >= 5 才可开启';if(state.ai_available&&state.settings.ai_content_index_html){const ai=text('a','访问 AI内容索引');ai.href=state.ai_url;ai.target='_blank';ai.rel='noopener';$('urls').append(ai);}const tasks=state.automatic_tasks||[];$('automatic').replaceChildren(...tasks.map(task=>text('p',task.lang+' 自动更新：'+({pending:'等待生成',complete:'已完成',failed:'失败'}[task.state]||task.state)+(task.result?.failures?.length?'；'+task.result.failures.map(x=>x.message).join('；'):''))));window.CmsModuleNavigation?.markClean(form);message(state.permissions.save?'地图设置已加载':'当前账号仅可查看地图设置');}catch(error){message(error.message,true);}finally{busy=false;controls();}}
form.addEventListener('submit',async event=>{event.preventDefault();if(busy)return;const input=new FormData(form);for(const flag of flags)input.set(flag,form.elements[flag].checked?'1':'0');busy=true;controls();try{const data=await api('save',input,true);window.CmsModuleNavigation?.markClean(form);message(data.message||'设置已保存');}catch(error){message(error.message,true);}finally{busy=false;controls();}});
$('generate').addEventListener('click',async()=>{if(busy)return;busy=true;controls();let result;try{const input=new FormData();input.set('lang',lang);result=await api('generate',input,true);}catch(error){message(error.message,true);}finally{busy=false;controls();}if(result){await load();message('已生成 '+result.files.length+' 个文件'+(result.failures.length?'；失败：'+result.failures.map(x=>x.lang+' '+x.message).join('；'):''),result.failures.length>0);}});
$('clean').addEventListener('click',async()=>{if(busy||!await window.CmsUI.confirm('清理当前语言的受控生成地图？修改过或不属于系统管理的文件会保留。',{title:'清理生成地图',confirmText:'确认清理'}))return;if(busy)return;busy=true;controls();try{const input=new FormData();input.set('lang',lang);const data=await api('clean',input,true);message('已清理 '+data.removed_pages+' 个地图文件；保留修改文件 '+data.modified_files_preserved.length+' 个');}catch(error){message(error.message,true);}finally{busy=false;controls();}});$('reload').addEventListener('click',load);$('lang').addEventListener('change',()=>{lang=$('lang').value;load();});load();})();
</script></body></html>
