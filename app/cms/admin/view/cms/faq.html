<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>常见问题管理</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#25304a;font:14px system-ui,sans-serif;padding:24px}main{background:#fff;border-radius:10px;padding:24px}h1{font-size:22px;margin-top:0}h2{font-size:20px;margin-top:0}button,input,select,textarea{font:inherit}button{padding:8px 14px;border:1px solid #d7dce3;background:#fff;border-radius:5px;cursor:pointer}button.primary{background:#2369d8;color:#fff;border-color:#2369d8}button.danger{color:#b52828}button:disabled{cursor:not-allowed;opacity:.5}input,select,textarea{padding:9px;border:1px solid #d7dce3;border-radius:5px}header,.row,footer{display:flex;align-items:center;gap:10px;flex-wrap:wrap}header{margin-bottom:18px}header input{width:250px}table{border-collapse:collapse;width:100%}th,td{padding:12px;text-align:left;border-bottom:1px solid #e7eaf0}th{background:#f7f9fc}td button{margin-right:8px}footer{margin-top:20px}.status{color:#b52828;white-space:pre-wrap;min-height:20px}.muted{color:#68768a;font-size:13px}dialog{width:min(1000px,94vw);max-height:92vh;border:0;border-radius:10px;padding:24px}dialog::backdrop{background:#10204077}label{display:flex;flex-direction:column;gap:6px}.group-fields{display:grid;grid-template-columns:1fr 180px;gap:16px}.question{border:1px solid #dfe5ed;background:#fafbfc;border-radius:7px;padding:16px;margin:16px 0}.question header{margin-bottom:12px}.question h3{margin:0;margin-right:auto;font-size:15px}.question label{margin-top:12px}.question input[type=text],textarea{width:100%}textarea{min-height:135px;font-family:ui-monospace,monospace;line-height:1.5}.question iframe{border:1px solid #d7dce3;width:100%;min-height:130px;background:white;margin-top:8px}.toolbar{display:flex;gap:8px;margin-top:8px}.toolbar button{font-size:12px;padding:5px 9px}.actions{display:flex;gap:10px;justify-content:flex-end;position:sticky;bottom:-24px;background:#fff;padding:18px 0;margin-top:16px;border-top:1px solid #e7eaf0}.check{flex-direction:row;align-items:center}.empty{padding:30px;text-align:center;color:#68768a}@media(max-width:600px){body{padding:12px}main,dialog{padding:16px}.group-fields{grid-template-columns:1fr}.scroll{overflow:auto}}
</style><link rel="stylesheet" href="<?= htmlspecialchars(\app\cms\AssetManifest::url('/app/admin/admin/css/cms-content-pages.css?v=20261105-content1'), ENT_QUOTES | ENT_SUBSTITUTE, 'UTF-8') ?>"><link rel="stylesheet" href="<?= htmlspecialchars(\app\cms\AssetManifest::url('/app/admin/admin/css/cms-page-adapters.css?v=20261105-adapters1'), ENT_QUOTES | ENT_SUBSTITUTE, 'UTF-8') ?>">
<link rel="stylesheet" href="<?= htmlspecialchars(\app\cms\AssetManifest::url('/app/admin/admin/css/cms-module-navigation.css?v=20261106-basic2'), ENT_QUOTES | ENT_SUBSTITUTE, 'UTF-8') ?>"><script src="<?= htmlspecialchars(\app\cms\AssetManifest::url('/app/admin/admin/js/cms-module-navigation.js?v=20261106-basic2'), ENT_QUOTES | ENT_SUBSTITUTE, 'UTF-8') ?>"></script>
</head><body class="cms-content-page cms-content-faq cms-page-adapted"><div data-cms-module-navigation></div><h1>常见问题</h1><main class="cms-page-panel"><header class="cms-filterbar" data-cms-filter><label>语言<select id="language" aria-label="语言"></select></label><label>分组名称<input id="search" placeholder="搜索分组"></label><button id="find">查询</button><button id="create" class="primary cms-primary-action">新增分组</button></header><p class="muted">每个分组可维护多条问答。模板使用 {<?= htmlspecialchars(\app\cms\template\TemplateMode::current(), ENT_QUOTES, 'UTF-8') ?>:faq group_id="分组ID"} 读取；默认读取只显示启用分组。</p><p id="status" class="status" role="status" aria-live="polite"></p><div class="scroll cms-table-scroll"><table><thead><tr><th>ID</th><th>分组名称</th><th>状态</th><th>问答数</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><footer><button id="previous">上一页</button><span id="page"></span><button id="next">下一页</button></footer></main>
<dialog id="editor" data-cms-dialog-kind="edit" data-cms-editor="page"><h2 id="editor-title"></h2><form id="faq-form"><div class="group-fields"><label>分组名称（最多60字）<input id="group-title" name="group_title" maxlength="60" required></label><label>状态<select id="group-status" name="status"><option value="1">启用</option><option value="0">停用</option></select></label></div><p id="group-meta" class="muted"></p><div id="questions"></div><button id="add-question" type="button">添加问答</button><p class="muted">新问答的问题和回答至少填写一项；已有问答可清空内容。问答删除及排序将在保存后生效。</p><p id="editor-status" class="status" role="status" aria-live="polite"></p><div class="actions"><button id="close-editor" type="button">取消</button><button id="save" type="submit" class="primary">保存分组和问答</button></div></form></dialog>
<dialog id="delete-dialog" data-cms-dialog-kind="confirm"><h2>永久删除分组</h2><p id="delete-message"></p><p>该分组及全部问答会被永久删除，无法从回收站恢复。</p><form id="delete-form"><label class="check"><input id="confirm-delete" type="checkbox" required>我确认永久删除该分组及全部问答</label><p id="delete-status" class="status" role="status" aria-live="polite"></p><div class="actions"><button id="cancel-delete" type="button">取消</button><button id="execute-delete" class="danger" type="submit" disabled>确认永久删除</button></div></form></dialog>
<script>
function pageStatus(text,error=false){const node=document.querySelector('#status');node.textContent=text;node.dataset.error=String(error);}

'use strict';
const $=s=>document.querySelector(s),el=(tag,text)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n};
let lang=new URLSearchParams(location.search).get('lang')||'cn',page=1,count=0,permissions={save:false,delete:false},editing=null,deleteIds=[],deleting=null;
const pendingWrites=new WeakMap();
async function withPendingWrite(enabled,run){if(!enabled)return run();const roots=[document.body,...document.querySelectorAll('dialog[open]')];roots.forEach(root=>{pendingWrites.set(root,(pendingWrites.get(root)||0)+1);root.setAttribute('data-cms-submit-busy','');root.setAttribute('aria-busy','true')});try{return await run()}finally{roots.forEach(root=>{const count=(pendingWrites.get(root)||1)-1;if(count)pendingWrites.set(root,count);else{pendingWrites.delete(root);root.removeAttribute('data-cms-submit-busy');root.removeAttribute('aria-busy')}})}}
async function api(action,data){return withPendingWrite(!!data,async()=>{const response=await fetch('/web-admin/faq/'+action,{method:data?'POST':'GET',body:data,headers:{Accept:'application/json'}});let result;try{result=await response.json()}catch{throw Error('请求失败，请刷新后重试')}if(result.code!==0)throw Error(result.msg||'操作失败');return result})}
function button(text,handler,className=''){const b=el('button',text);b.type='button';b.className=className;b.onclick=handler;return b}
async function load(){try{const params=new URLSearchParams({lang,page,limit:20,q:$('#search').value});const result=await api('select?'+params);permissions=result.permissions;count=result.count;const selected=lang;$('#language').replaceChildren();result.languages.forEach(item=>$('#language').append(new Option(item.title+' ('+item.mark+')',item.mark)));$('#language').value=selected;$('#rows').replaceChildren();result.data.forEach(row=>{const tr=el('tr');[row.group_id,row.group_title,Number(row.status)?'启用':'停用',row.question_count].forEach(value=>tr.append(el('td',String(value))));const actions=el('td');actions.append(button(permissions.save?'编辑':'查看',()=>openEditor(row.group_id)));if(permissions.delete)actions.append(button('删除',()=>openDelete(row),'danger'));tr.append(actions);$('#rows').append(tr)});if(!result.data.length){const tr=el('tr'),td=el('td','暂无分组');td.colSpan=5;td.className='empty';tr.append(td);$('#rows').append(tr)}$('#create').hidden=!permissions.save;$('#page').textContent='第 '+page+' 页 · 共 '+count+' 个分组';$('#previous').disabled=page<=1;$('#next').disabled=page*20>=count;pageStatus('')}catch(error){pageStatus(error.message,true)}}
function wrapSelection(area,before,after){const start=area.selectionStart,end=area.selectionEnd;area.setRangeText(before+area.value.slice(start,end)+after,start,end,'select');area.dispatchEvent(new Event('input'));area.focus()}
function addQuestion(item={}){const card=el('section');card.className='question';card.dataset.id=item.asklist_id||0;const head=el('header'),heading=el('h3','问答'+(item.asklist_id?' #'+item.asklist_id:'（新增）'));head.append(heading,button('上移',()=>{const previous=card.previousElementSibling;if(previous){card.parentNode.insertBefore(card,previous);renumber()}}),button('下移',()=>{const next=card.nextElementSibling;if(next){card.parentNode.insertBefore(next,card);renumber()}}),button('移除问答',()=>{if(Number(card.dataset.id))deleteIds.push(Number(card.dataset.id));card.remove();renumber()},'danger'));card.append(head);const orderLabel=el('label','排序（小的靠前）'),order=el('input');order.type='number';order.min='0';order.max='2147483647';order.className='question-order';order.value=item.sort_order??($('#questions').children.length+1);orderLabel.append(order);card.append(orderLabel);const qLabel=el('label','问题'),question=el('input');question.type='text';question.maxLength=255;question.className='question-title';question.value=item.asklist_title||'';qLabel.append(question);card.append(qLabel);const aLabel=el('label','回答（HTML）'),answer=el('textarea');answer.className='question-answer';answer.value=item.asklist_content||'';answer.spellcheck=false;aLabel.append(answer);card.append(aLabel);const toolbar=el('div');toolbar.className='toolbar';toolbar.append(button('插入段落',()=>wrapSelection(answer,'<p>','</p>')),button('加粗选中内容',()=>wrapSelection(answer,'<strong>','</strong>')));const preview=el('iframe');preview.title='回答预览';preview.setAttribute('sandbox','');preview.referrerPolicy='no-referrer';preview.hidden=true;toolbar.append(button('预览回答',()=>{preview.hidden=!preview.hidden;if(!preview.hidden)preview.srcdoc='<meta http-equiv="Content-Security-Policy" content="default-src \'none\'; img-src data: http: https:; style-src \'unsafe-inline\'"><style>body{font:14px system-ui;overflow-wrap:anywhere}img{max-width:100%}</style>'+answer.value}));card.append(toolbar,preview);if(!permissions.save)card.querySelectorAll('input,textarea,button').forEach(control=>control.disabled=true);$('#questions').append(card)}
function renumber(){window.CmsUI?.dirty($('#faq-form'));$('#questions').querySelectorAll('.question-order').forEach((input,i)=>input.value=i+1)}
async function openEditor(id=0){try{editing=id?(await api('detail?'+new URLSearchParams({group_id:id,lang}))).data:{group_id:0,group_title:'',status:1,items:[]};deleteIds=[];$('#editor-title').textContent=id?'编辑常见问题分组':'新增常见问题分组';$('#group-title').value=editing.group_title;$('#group-status').value=String(editing.status);$('#group-meta').textContent='语言：'+lang+(id?' · 分组ID：'+id:'');$('#questions').replaceChildren();editing.items.forEach(addQuestion);if(!editing.items.length)addQuestion();$('#editor-status').textContent='';$('#save').hidden=!permissions.save;$('#add-question').hidden=!permissions.save;$('#group-title').readOnly=!permissions.save;$('#group-status').disabled=!permissions.save;$('#editor').showModal()}catch(error){pageStatus(error.message,true)}}
function openDelete(row){deleting=row;$('#delete-message').textContent='分组 #'+row.group_id+'「'+row.group_title+'」';$('#confirm-delete').checked=false;$('#execute-delete').disabled=true;$('#delete-status').textContent='';$('#delete-dialog').showModal()}
$('#faq-form').onsubmit=async event=>{event.preventDefault();if($('#save').disabled)return;$('#save').disabled=true;try{const data=new FormData();data.append('lang',lang);data.append('group_id',editing.group_id||0);data.append('group_title',$('#group-title').value);data.append('status',$('#group-status').value);const items=Array.from($('#questions').children).map(card=>({asklist_id:Number(card.dataset.id),asklist_title:card.querySelector('.question-title').value,asklist_content:card.querySelector('.question-answer').value,sort_order:card.querySelector('.question-order').value}));data.append('items',JSON.stringify(items));data.append('delete_ids',JSON.stringify(deleteIds));const result=await api('save',data);window.CmsUI?.clean($('#faq-form'));$('#editor').close();await load();pageStatus('分组 #'+result.data.group_id+' 保存成功')}catch(error){$('#editor-status').textContent=error.message}finally{$('#save').disabled=false}};
$('#delete-form').onsubmit=async event=>{event.preventDefault();if($('#execute-delete').disabled||!$('#confirm-delete').checked)return;$('#execute-delete').disabled=true;try{const data=new FormData();data.append('lang',lang);data.append('ids[]',deleting.group_id);data.append('confirm','1');await api('delete',data);window.CmsUI?.clean($('#delete-form'));$('#delete-dialog').close();await load();pageStatus('分组及问答已删除')}catch(error){$('#delete-status').textContent=error.message;$('#execute-delete').disabled=false}};
$('#confirm-delete').onchange=()=>$('#execute-delete').disabled=!$('#confirm-delete').checked;$('#cancel-delete').onclick=()=>$('#delete-dialog').close();$('#close-editor').onclick=()=>$('#editor').close();$('#add-question').onclick=()=>{addQuestion();window.CmsUI?.dirty($('#faq-form'))};$('#create').onclick=()=>openEditor();$('#language').onchange=()=>{lang=$('#language').value;page=1;const url=new URL(location.href);url.searchParams.set('lang',lang);history.replaceState(null,'',url);load()};$('#find').onclick=()=>{page=1;load()};$('#search').onkeydown=event=>{if(event.key==='Enter'){page=1;load()}};$('#previous').onclick=()=>{page--;load()};$('#next').onclick=()=>{page++;load()};load();
</script></body></html>
