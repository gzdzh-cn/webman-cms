        <script>
            // Fetch the initial image from HTML; refreshing must not wait for UI modules.
            var refreshLoginCaptcha = (function () {
                var image = document.querySelector('.codeImage');
                function refresh() {
                    image.alt = '验证码加载中';
                    image.src = '/web-admin/account/captcha/login?v=' + Date.now() + '-' + Math.random().toString(36).slice(2);
                }
                image.addEventListener('click', refresh);
                image.addEventListener('keydown', function (event) {
                    if (event.key === 'Enter' || event.key === ' ') {
                        event.preventDefault();
                        refresh();
                    }
                });
                image.addEventListener('load', function () { image.alt = '验证码，点击刷新'; });
                image.addEventListener('error', function () { image.alt = '验证码加载失败，点击重试'; });
                return refresh;
            })();
        </script>
        <!-- 资 源 引 入 -->
        <script src="<?= htmlspecialchars(\app\cms\AssetManifest::url('/app/admin/component/layui/layui.js?v=2.13.12'), ENT_QUOTES | ENT_SUBSTITUTE, 'UTF-8') ?>"></script>
        <script>
         
            layui.use(['form', 'layer'], function() {
                var $ = layui.$, layer = layui.layer, form = layui.form;
                var loginPending = false;
                // 登 录 提 交
                form.on('submit(login)', function (data) {
                    if (loginPending) return false;
                    var submitButton = $(data.elem), loginSucceeded = false;
                    loginPending = true;
                    submitButton.prop('disabled', true).attr('aria-busy', 'true');
                    var loadingIndex = layer.load();
                    $.ajax({
                        url: '/web-admin/account/login',
                        type: "POST",
                        dataType: 'json',
                        timeout: 15000,
                        data: data.field,
                        success: function (res) {
                            if (res && res.code === 0) {
                                loginSucceeded = true;
                                window.CmsUI.clean(data.form);
                                window.CmsUI.toast('登录成功', {kind: 'success', duration: 1000});
                                window.setTimeout(function () {
                                    window.CmsUI.clean(data.form);
                                    location.replace(location.href);
                                }, 800);
                            } else {
                                window.CmsUI.toast(res && res.msg || '登录失败，请重试', {kind: 'error'});
                                refreshLoginCaptcha();
                            }
                        },
                        error: function (xhr, status) {
                            window.CmsUI.toast(status === 'timeout' ? '登录请求超时，请重试' : (xhr.responseJSON && xhr.responseJSON.msg || '登录请求失败，请检查网络后重试'), {kind: 'error'});
                            refreshLoginCaptcha();
                        },
                        complete: function () {
                            layer.close(loadingIndex);
                            loginPending = loginSucceeded;
                            submitButton.prop('disabled', loginSucceeded).attr('aria-busy', 'false');
                        }
                    });
                    return false;
                });
            })
        </script>
