                    <div class="layui-form-item">

        <!-- 数据表格 -->
        <div class="layui-card cms-page-panel">
            <div class="layui-card-body">
                <table id="data-table" lay-filter="data-table"></table>
            </div>
        </div>

        <!-- 表格顶部工具栏 -->
        <script type="text/html" id="table-toolbar">
            <button class="pear-btn pear-btn-primary pear-btn-xs cms-primary-action" lay-event="add" permission="app.admin.admin.insert">
                <i class="layui-icon layui-icon-add-1"></i>新增
            </button>
            <button class="pear-btn pear-btn-danger pear-btn-xs" lay-event="batchRemove" permission="app.admin.admin.delete">
                <i class="layui-icon layui-icon-delete"></i>删除
            </button>
        </script>

        <!-- 表格行工具栏 -->
        <script type="text/html" id="table-bar">
            {{# if(d.show_toolbar){ }}
            <button class="pear-btn pear-btn-xs tool-btn" lay-event="edit" permission="app.admin.admin.update">编辑</button>
            <button class="pear-btn pear-btn-xs tool-btn" lay-event="remove" permission="app.admin.admin.delete">删除</button>
            {{# } }}
        </script>

        <script src="<?= htmlspecialchars(\app\cms\AssetManifest::url('/app/admin/component/layui/layui.js?v=2.13.12'), ENT_QUOTES | ENT_SUBSTITUTE, 'UTF-8') ?>"></script>
        <script src="<?= htmlspecialchars(\app\cms\AssetManifest::url('/app/admin/component/pear/pear.js'), ENT_QUOTES | ENT_SUBSTITUTE, 'UTF-8') ?>"></script>
        <script src="<?= htmlspecialchars(\app\cms\AssetManifest::url('/app/admin/admin/js/permission.js'), ENT_QUOTES | ENT_SUBSTITUTE, 'UTF-8') ?>"></script>
        <script src="<?= htmlspecialchars(\app\cms\AssetManifest::url('/app/admin/admin/js/common.js'), ENT_QUOTES | ENT_SUBSTITUTE, 'UTF-8') ?>"></script>
        <script>

            // 相关常量
            const PRIMARY_KEY = "id";
            const SELECT_API = "/app/admin/admin/select";
            const UPDATE_API = "/app/admin/admin/update";
            const DELETE_API = "/app/admin/admin/delete";
            const INSERT_URL = "/app/admin/admin/insert";
            const UPDATE_URL = "/app/admin/admin/update";
            
            // 字段 创建时间 created_at
            layui.use(["laydate"], function() {
                layui.laydate.render({
                    elem: "#created_at",
                    range: ["#created_at-date-start", "#created_at-date-end"],
                });
            })
            
            // 表格渲染
            layui.use(["table", "form", "pearCommon", "pearPopup", "util"], function() {
                let table = layui.table;
                let form = layui.form;
                let $ = layui.$;
                let common = layui.pearCommon;
                let util = layui.util;
                
				// 表头参数
				let cols = [
					{
						type: "checkbox"
					},{
						title: "ID",
						field: "id",
                        width: 100,
                        sort: true,
					},{
						title: "用户名",
						field: "username",
						minWidth: 160,
					},{
						title: "昵称",
						field: "nickname",
					},{
						title: "密码",
						field: "password",
						hide: true,
					},{
						title: "头像",
						field: "avatar",
						templet: function (d) {
							return '<img src="'+encodeURI(d['avatar'])+'" style="max-width:32px;max-height:32px;" alt="" />'
						},
                        width: 90,
					},{
						title: "邮箱",
						field: "email",
                        hide: true,
					},{
						title: "手机",
						field: "mobile",
                        hide: true,
					},{
						title: "创建时间",
						field: "created_at",
						hide: true,
					},{
						title: "更新时间",
						field: "updated_at",
						hide: true,
					},{
                        title: "最后登录时间",
                        field: "login_at",
                    },{
						title: "角色组",
						field: "roles",
						templet: function (d) {
							let field = "roles";
							if (typeof d[field] == "undefined") return "";
							let items = [];
							layui.each((d[field] + "").split(","), function (k , v) {
								items.push(apiResults[field][v] || v);
							});
							return util.escape(items.join(","));
						}
					},{
                        title: "禁用",
                        field: "status",
                        templet: function (d) {
                            let field = "status";
                            form.on("switch("+field+")", function (data) {
                                const checkbox = data.elem;
                                const original = !checkbox.checked;
                                if (checkbox.dataset.cmsPending === '1') {
                                    checkbox.checked = original;
                                    form.render('checkbox');
                                    return;
                                }
                                checkbox.dataset.cmsPending = '1';
                                checkbox.disabled = true;
                                form.render('checkbox');
                                const load = layer.load();
                                const postData = {};
                                postData[field] = checkbox.checked ? 1 : 0;
                                postData[PRIMARY_KEY] = checkbox.value;
                                $.ajax({
                                    url: UPDATE_API, type: 'POST', dataType: 'json', data: postData,
                                    success: function (res) {
                                        if (res.code) {
                                            checkbox.checked = original;
                                            layui.pearPopup.failure(res.msg || '保存失败');
                                        } else layui.pearPopup.success('操作成功');
                                    },
                                    error: function () {
                                        checkbox.checked = original;
                                        layui.pearPopup.failure('保存失败，请检查网络或登录状态后重试');
                                    },
                                    complete: function () {
                                        layer.close(load);
                                        delete checkbox.dataset.cmsPending;
                                        checkbox.disabled = false;
                                        form.render('checkbox');
                                    }
                                });
                            });
                            let checked = d[field] === 1 ? "checked" : "";
                            if (Number(top.Admin?.Account?.id) === Number(d.id)) return '';
                            return '<input type="checkbox" value="'+util.escape(d[PRIMARY_KEY])+'" lay-filter="'+util.escape(field)+'" lay-skin="switch" lay-text="'+util.escape('')+'" '+checked+'/>';
                        },
                        width: 90,
                    },{
						title: "操作",
						toolbar: "#table-bar",
						align: "center",
						fixed: window.matchMedia("(max-width: 767px)").matches ? false : "right",
                        width: 130,
					}
				];
				
				window.CmsModuleNavigation.bindTable(table, 'data-table', ['username','nickname','email','mobile','created_at[]','field','order']);
                // 渲染表格
				function render()
				{
				    table.render({
				        elem: "#data-table",
				        url: SELECT_API,
				        page: {curr: window.CmsModuleNavigation.tableState().curr},
                        where: window.CmsModuleNavigation.tableState().where,
				        cols: [cols],
				        skin: "line",
				        size: "lg",
				        toolbar: "#table-toolbar",
				        autoSort: false,
                        id: "data-table",
				        defaultToolbar: [{
				            title: "刷新",
				            layEvent: "refresh",
				            icon: "layui-icon-refresh",
				        }, "filter", "print", "exports"],
				        done: function () {
				            layer.photos({photos: 'div[lay-id="data-table"]', anim: 5});
				        }
				    });
				}
				
				// 获取表格中下拉或树形组件数据
				let apis = [];
				apis.push(["roles", "/app/admin/role/select?format=select"]);
				let apiResults = {};
				apiResults["roles"] = [];
				let count = apis.length;
				layui.each(apis, function (k, item) {
				    let [field, url] = item;
				    $.ajax({
				        url: url,
				        dateType: "json",
				        success: function (res) {
                            if (res.code) {
                                return layui.pearPopup.failure(res.msg);
                            }
				            function travel(items) {
				                for (let k in items) {
				                    let item = items[k];
				                    apiResults[field][item.value] = item.name;
				                    if (item.children) {
				                        travel(item.children);
				                    }
				                }
				            }
				            travel(res.data);
				        },
				        complete: function () {
				            if (--count === 0) {
				                render();
				            }
				        }
				    });
				});
				if (!count) {
				    render();
				}
				
                // 编辑或删除行事件
                table.on("tool(data-table)", function(obj) {
                    if (obj.event === "remove") {
                        remove(obj);
                    } else if (obj.event === "edit") {
                        edit(obj);
                    }
                });

                // 表格顶部工具栏事件
                table.on("toolbar(data-table)", function(obj) {
                    if (obj.event === "add") {
                        add();
                    } else if (obj.event === "refresh") {
                        refreshTable();
                    } else if (obj.event === "batchRemove") {
                        batchRemove(obj);
                    }
                });

                // 表格顶部搜索事件
                form.on("submit(table-query)", function(data) {
                    table.reload("data-table", {
                        page: {
                            curr: 1
                        },
                        where: data.field
                    })
                    return false;
                });
                
                // 表格顶部搜索重置事件
                form.on("submit(table-reset)", function(data) {
                    table.reload("data-table", {
                        where: []
                    })
                });

                // 表格排序事件
                table.on("sort(data-table)", function(obj){
                    table.reload("data-table", {
                        initSort: obj,
                        scrollPos: "fixed",
                        where: {
                            field: obj.field,
                            order: obj.type
                        }
                    });
                });

                // 表格新增数据
                let add = function() {
                    cmsOpenEditor(INSERT_URL);
                }

                // 表格编辑数据
                let edit = function(obj) {
                    let value = obj.data[PRIMARY_KEY];
                    cmsOpenEditor(UPDATE_URL + "?" + PRIMARY_KEY + "=" + value);
                }

                // 删除一行
                let remove = function(obj) {
                    return doRemove(obj.data[PRIMARY_KEY]);
                }

                // 删除多行
                let batchRemove = function(obj) {
                    let checkIds = common.checkField(obj, PRIMARY_KEY);
                    if (checkIds === "") {
                        layui.pearPopup.warning("未选中数据");
                        return false;
                    }
                    doRemove(checkIds.split(","));
                }

                // 执行删除
                let doRemove = function (ids) {
                    let data = {};
                    data[PRIMARY_KEY] = ids;
                    window.CmsUI.confirm("确认删除所选记录？请核对选择；删除后的恢复方式以该模块规则为准。", {title: "确认删除", confirmText: "确认删除"}).then(function(approved) {
                        if(!approved)return;
                        let loading = layer.load();
                        $.ajax({
                            url: DELETE_API,
                            data: data,
                            dataType: "json",
                            type: "post",
                            success: function(res) {
                                layer.close(loading);
                                if (res.code) {
                                    return layui.pearPopup.failure(res.msg);
                                }
                                return layui.pearPopup.success("操作成功", refreshTable);
                            }
                        })
                    });
                }

                // 刷新表格数据
                window.refreshTable = function() {
                    table.reloadData("data-table", {
                        scrollPos: "fixed",
                        done: function (res, curr) {
                            if (curr > 1 && res.data && !res.data.length) {
                                curr = curr - 1;
                                table.reloadData("data-table", {
                                    page: {
                                        curr: curr
                                    },
                                })
                            }
                        }
                    });
                }
            })

        </script>
    
<script>
function cmsOpenEditor(href) {
    window.CmsModuleNavigation?.capture();
    const target=new URL(href,location.href),source=new URL(location.href);
    const language=window.CmsEditContext?.get()?.edit||source.searchParams.get('lang')||window.CmsLanguageInitial?.lang;
    if(language)target.searchParams.set('lang',language);
    target.searchParams.set('return',source.pathname+source.search);
    location.assign(target.pathname+target.search);
}
</script>
</body>
