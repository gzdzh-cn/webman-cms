        <script>
            // Start private, request-scoped data alongside CSS and UI modules.
            // Resolve failures as data until navigation owns the error display.
            window.CmsWorkspaceBootstrap = Promise.all([
                '/web-admin/config/get', '/web-admin/rule/get?navigation=1'
            ].map(async function (url) {
                var controller = new AbortController();
                var timeout = window.setTimeout(function () { controller.abort(); }, 15000);
                try {
                    var response = await fetch(url, {credentials: 'same-origin', cache: 'no-store', headers: {Accept: 'application/json'}, signal: controller.signal});
                    if (!response.ok) throw new Error('读取后台导航失败，请重新加载');
                    return await response.json();
                } finally { window.clearTimeout(timeout); }
            })).then(function (data) { return {data: data}; }, function () {
                return {error: '读取后台配置或导航失败，请检查网络后重新加载'};
            });
        </script>

        <!-- 框 架 初 始 化 -->
        <script>

            // Admin
            window.Admin = {
                Account: {}
            };
            window.CmsBranding = {
                setName: function(value) {
                    if (typeof value !== 'string') return;
                    var name = '后台管理';
                    document.title = name;
                    document.querySelectorAll('.layui-logo .title').forEach(function(node) {
                        node.textContent = name;
                    });
                }
            };

            layui.use(["pearAdmin","jquery","pearPopup"], function() {
                var $ = layui.$;
                var admin = layui.pearAdmin;
                var popup = layui.pearPopup;

                admin.setConfigType("json");
                admin.setConfigPath("/web-admin/config/get");

                window.CmsNavigation.start(admin);

                // 登出逻辑
                admin.logout(function(){
                    $.ajax({
                        url: "/web-admin/account/logout",
                        dataType: "json",
                        success: function (res) {
                            if (res.code) {
                                return popup.failure(res.msg);
                            }
                            popup.success("已退出登录",function(){
                                location.reload();
                            })
                        }
                    });
                    return false;
                })

                $.ajax({
                    url: "/web-admin/account/info",
                    dataType: 'json',
                    success: function (res) {
                        window.Admin.Account = res.data;
                        $('.cms-account-name').text(res.data.nickname || res.data.username || '账户');
                    }
                });

                // 消息点击回调
                //admin.message(function(id, title, context, form) {});
            });

        </script>
