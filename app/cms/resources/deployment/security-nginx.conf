# Dedicated Webman virtual host. Replace domain/TLS/listen values before use.
# Proxy all public responses through Webman; do not add a PHP-FPM handler or
# a try_files/static alias for uploads, themes or generated public/html pages.
server {
    listen 80;
    server_name cms.example.invalid;
    client_max_body_size 12m;
    add_header X-Content-Type-Options nosniff always;

    location ~ (^|/)\. { return 404; }
    location ~* ^/(?:runtime|vendor|config|docs|support|app/cms|weapp|plugin)(?:/|$) { return 404; }
    location ~* ^/install_[a-z0-9]+(?:/|$) { return 404; }
    location ~* \.(?:sql|env|ini|log|bak|phar|phtml|pht|cgi|asp|aspx|jsp)$ { return 404; }
    # index.php and install/index.php are legacy application routes only.
    location ~* \.php(?:/|$) {
        if ($uri !~ ^/(?:index\.php(?:/.*)?|install/index\.php)$) { return 404; }
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
