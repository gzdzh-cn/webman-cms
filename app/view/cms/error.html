<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>{{title}}</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f7fb;color:#25344a;font:16px/1.7 system-ui,-apple-system,"Segoe UI",sans-serif}main{width:min(100%,580px);padding:48px 32px;border:1px solid #e3e9f2;border-radius:16px;background:#fff;text-align:center}.illustration{width:112px;height:82px;margin:0 auto 28px;border:2px solid #b8c9e3;border-radius:9px;background:linear-gradient(#e9eff8 20px,#f6f8fc 20px);position:relative}.illustration:before{content:"•••";position:absolute;top:-7px;left:10px;color:#a8bad4;letter-spacing:3px}.illustration:after{content:"!";position:absolute;inset:27px 0 0;color:#7291be;font-size:28px;font-weight:600}.code{margin:0;color:#8a9bb3;font-size:13px;letter-spacing:2px}h1{margin:10px 0 12px;font-size:26px;font-weight:600}p{margin:0;color:#758398}a{display:inline-block;margin-top:28px;padding:10px 26px;border-radius:6px;background:#306ad9;color:white;text-decoration:none}a:hover{background:#2459bd}a:focus-visible{outline:3px solid #9bbaf4;outline-offset:4px}@media(max-width:480px){body{padding:16px}main{padding:36px 20px}h1{font-size:23px}}
</style></head>
<body><main aria-labelledby="error-title"><div class="illustration" aria-hidden="true"></div><p class="code">ERROR {{status}}</p><h1 id="error-title">{{title}}</h1><p>{{message}}</p><a href="{{home}}">返回首页</a></main></body>
</html>
